<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="background-color" content="#090d16">
  <title>UniPilot — Offline</title>
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#090d16;color:#e5e7eb;font:15px system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,440px);padding:32px;border:1px solid #293449;border-radius:22px;background:#111827;text-align:center;box-shadow:0 20px 60px #0006}
    img{width:76px;height:76px;object-fit:contain;margin-bottom:14px}h1{font-size:25px;margin:0 0 10px}p{color:#9ca3af;line-height:1.65;margin:0 0 22px}
    button{border:0;border-radius:12px;background:#8b5cf6;color:white;font-weight:700;padding:12px 20px;font-size:14px;cursor:pointer}button:focus-visible{outline:3px solid #c4b5fd;outline-offset:3px}
  </style>
</head>
<body><main>
  <img src="/icons/icon-192.png" alt="UniPilot">
  <h1>You’re offline</h1>
  <p>UniPilot couldn’t reach the network. Your saved work remains on this device. Reconnect and try again to load the latest version.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main></body>
</html>
