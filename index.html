      activePdfPages = [];
      appState.pdfReaderLastOpened = id; saveState();

      const overlay = document.createElement('section');
      overlay.id = 'uniPdfFullscreen';
      overlay.className = 'fixed inset-0 z-[10000] bg-[#090d16] flex flex-col text-white';
      overlay.innerHTML = `
        <header class="shrink-0 px-2 sm:px-4 py-2 flex flex-wrap items-center gap-2 bg-slate-950 border-b border-white/10" style="padding-top:calc(8px + env(safe-area-inset-top,0px))">
          <button type="button" onclick="closePdfFullscreen()" class="rounded-lg bg-white/10 px-3 py-2 text-xs">← Library</button>
          <div class="min-w-0 flex-1"><div class="font-semibold text-sm truncate">${esc(doc.name)}</div><div class="text-[10px] text-slate-400">PDF Reader · ${pdf.numPages} pages</div></div>
          <button type="button" onclick="changePdfZoom(-1)" class="rounded-lg bg-white/10 px-3 py-2 text-sm" aria-label="Zoom out">−</button>
          <button type="button" onclick="changePdfZoom(1)" class="rounded-lg bg-white/10 px-3 py-2 text-sm" aria-label="Zoom in">＋</button>
          <button type="button" id="uniPdfFit" onclick="togglePdfFitWidth()" class="rounded-lg bg-white/10 px-3 py-2 text-xs">Fit width</button>
          <a id="uniPdfDownload" class="rounded-lg bg-white/10 px-3 py-2 text-xs" download="${esc(doc.name)}">↓ Download</a>
          <button type="button" onclick="togglePdfFullscreen()" class="rounded-lg bg-cyan-400 text-slate-950 font-semibold px-3 py-2 text-xs">⛶ Full screen</button>
        </header>
        <div class="shrink-0 flex items-center justify-center gap-3 bg-slate-900 border-b border-white/10 px-3 py-2">
          <button type="button" onclick="changePdfPage(-1)" class="rounded-lg bg-white/10 px-3 py-1.5 text-xs">Previous</button>
          <label class="text-xs text-slate-300 flex items-center gap-1">Page <input id="uniPdfPageInput" type="number" min="1" max="${pdf.numPages}" value="${activePdfPageNumber}" inputmode="numeric" class="w-14 rounded bg-slate-800 border border-white/10 px-2 py-1 text-center text-white"></label>
          <span class="text-xs text-slate-400">of <strong>${pdf.numPages}</strong></span>
          <button type="button" onclick="changePdfPage(1)" class="rounded-lg bg-white/10 px-3 py-1.5 text-xs">Next</button>
        </div>
        <div id="uniPdfCanvasScroll" class="flex-1 min-h-0 overflow-auto bg-slate-800 px-2 py-4 sm:px-6" style="-webkit-overflow-scrolling:touch;overscroll-behavior:contain">
          <div id="uniPdfPageHost" class="mx-auto" style="width:max-content;min-width:100%"></div>
        </div>`;
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
      const downloadUrl = URL.createObjectURL(new Blob([buffer], { type: 'application/pdf' }));
      pdfLocalUrl = downloadUrl;
      overlay.querySelector('#uniPdfDownload').href = downloadUrl;
      await buildPdfPageList();
      window.addEventListener('keydown', pdfEscapeHandler);
      const pageInput = overlay.querySelector('#uniPdfPageInput');
      pageInput.addEventListener('change', () => goToPdfPage(Number(pageInput.value)));
    } catch (error) {
      console.error('PDF open failed:', error);
      showToast(`Unable to open this PDF: ${error.message || 'unknown error'}`, 'error');
    }
  };

  async function buildPdfPageList() {
    const pdf = activePdfJsDocument, host = document.getElementById('uniPdfPageHost'), scroller = document.getElementById('uniPdfCanvasScroll');
    if (!pdf || !host || !scroller) return;
    const generation = ++activePdfGeneration;
    if (activePdfObserver) activePdfObserver.disconnect();
    activePdfRenderTasks.forEach(task => { try { task.cancel(); } catch (_) {} });
    activePdfRenderTasks.clear();
    host.innerHTML = '';
    activePdfPages = [];
    const first = await pdf.getPage(1);
    if (generation !== activePdfGeneration || !document.getElementById('uniPdfFullscreen')) return;
    const base = first.getViewport({ scale: 1 });
    const available = Math.max(240, scroller.clientWidth - 32);
    const scale = activePdfFitWidth ? Math.min(2, available / base.width) : activePdfScale;
    const width = Math.max(1, Math.floor(base.width * scale));
    const height = Math.max(1, Math.floor(base.height * scale));
    for (let n = 1; n <= pdf.numPages; n++) {
      const pageBox = document.createElement('div');
      pageBox.className = 'uni-pdf-page';
      pageBox.dataset.page = String(n);
      pageBox.dataset.placeholderHeight = String(height);
      pageBox.style.cssText = `position:relative;width:${width}px;min-height:${height}px;margin:0 auto 14px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.28);overflow:hidden;`;
      const placeholder = document.createElement('div');
      placeholder.textContent = `Page ${n}`;
      placeholder.style.cssText = 'display:grid;place-items:center;min-height:inherit;color:#64748b;font:12px sans-serif';
      pageBox.appendChild(placeholder);
      host.appendChild(pageBox);
      activePdfPages.push(pageBox);
    }
    if ('IntersectionObserver' in window) {
      activePdfObserver = new IntersectionObserver(entries => entries.forEach(entry => {
        const n = Number(entry.target.dataset.page);
        if (entry.isIntersecting) renderPdfPage(n, generation);
        else if (Math.abs(n - activePdfPageNumber) > 2) freePdfPage(n);
      }), { root: scroller, rootMargin: '850px 0px' });
      activePdfPages.forEach(box => activePdfObserver.observe(box));
    } else {
      for (let n = 1; n <= Math.min(pdf.numPages, 3); n++) renderPdfPage(n, generation);
    }
    scroller.onscroll = () => {
      if (activePdfScrollFrame || activePdfProgrammaticScroll) return;
      activePdfScrollFrame = requestAnimationFrame(() => {
        activePdfScrollFrame = 0;
        const y = scroller.scrollTop + scroller.clientHeight * .3;
        let current = 1;
        for (let i = 0; i < activePdfPages.length; i++) { if (activePdfPages[i].offsetTop <= y) current = i + 1; else break; }
        activePdfPageNumber = current;
        const input = document.getElementById('uniPdfPageInput'); if (input) input.value = String(current);
        const record = appState.documents.find(d => d.id === activePdfLastId); if (record) record.lastPage = current;
      });
    };
    goToPdfPage(activePdfPageNumber);
  }

  async function renderPdfPage(number, generation = activePdfGeneration) {
    const pdf = activePdfJsDocument, box = activePdfPages[number - 1];
    if (!pdf || !box || box.dataset.rendered === String(generation)) return;
    box.dataset.rendered = String(generation);
    try {
      const page = await pdf.getPage(number);
      if (generation !== activePdfGeneration || !box.isConnected) return;
      const scroller = document.getElementById('uniPdfCanvasScroll');
      const base = page.getViewport({ scale: 1 });
      const available = Math.max(240, (scroller?.clientWidth || innerWidth) - 32);
      const scale = activePdfFitWidth ? Math.min(2, available / base.width) : activePdfScale;
      const viewport = page.getViewport({ scale });
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(viewport.width * ratio); canvas.height = Math.floor(viewport.height * ratio);
      canvas.style.cssText = `display:block;width:${Math.floor(viewport.width)}px;height:${Math.floor(viewport.height)}px;max-width:none`;
      box.style.width = `${Math.floor(viewport.width)}px`; box.style.height = `${Math.floor(viewport.height)}px`;
      box.innerHTML = ''; box.appendChild(canvas);
      const task = page.render({ canvasContext: canvas.getContext('2d', { alpha: false }), viewport, background: '#fff', transform: ratio === 1 ? null : [ratio, 0, 0, ratio, 0, 0] });
      activePdfRenderTasks.set(number, task);
      await task.promise;
      if (generation !== activePdfGeneration) return;
      activePdfRenderTasks.delete(number);
      // Add a selectable text layer above the canvas, matching the reference reader.
      if (window.pdfjsLib?.renderTextLayer) {
        const textContent = await page.getTextContent();
        if (generation === activePdfGeneration && box.isConnected) {
          const layer = document.createElement('div');
          layer.className = 'uni-pdf-text-layer';
          layer.style.cssText = `position:absolute;inset:0;width:${viewport.width}px;height:${viewport.height}px;overflow:hidden;line-height:1;text-align:left;z-index:2`;
          box.appendChild(layer);
          await window.pdfjsLib.renderTextLayer({ textContent, container: layer, viewport, textDivs: [] }).promise;
        }
      }
    } catch (error) {
      activePdfRenderTasks.delete(number);
      if (error?.name !== 'RenderingCancelledException') {
        box.textContent = `Could not render page ${number}. Scroll away and back to retry.`;
        box.style.cssText += 'color:#b91c1c;background:#fff;padding:20px;font:13px sans-serif';
        delete box.dataset.rendered;
      }
    }
  }

  function freePdfPage(number) {
    const box = activePdfPages[number - 1]; if (!box || !box.dataset.rendered) return;
    const task = activePdfRenderTasks.get(number); if (task) { try { task.cancel(); } catch (_) {} activePdfRenderTasks.delete(number); }
    box.innerHTML = `Page ${number}`;
    box.style.height = ''; box.style.minHeight = `${box.dataset.placeholderHeight || 500}px`;
    delete box.dataset.rendered;
  }

  function goToPdfPage(number) {
    if (!activePdfPages.length) return;
    const page = Math.max(1, Math.min(activePdfPages.length, Math.round(number) || 1));
    activePdfPageNumber = page;
    const input = document.getElementById('uniPdfPageInput'); if (input) input.value = String(page);
    const scroller = document.getElementById('uniPdfCanvasScroll'), box = activePdfPages[page - 1];
    if (scroller && box) {
      activePdfProgrammaticScroll = true;
      scroller.scrollTo({ top: Math.max(0, box.offsetTop - 12), behavior: 'auto' });
      setTimeout(() => { activePdfProgrammaticScroll = false; }, 160);
      renderPdfPage(page);
    }
    const record = appState.documents.find(d => d.id === activePdfLastId); if (record) { record.lastPage = page; saveState(); }
  }
  window.changePdfPage = delta => goToPdfPage(activePdfPageNumber + delta);
  window.goToPdfPage = goToPdfPage;
  window.changePdfZoom = delta => {
    activePdfFitWidth = false;
    activePdfScale = Math.max(.4, Math.min(3, activePdfScale + delta * .15));
    const fit = document.getElementById('uniPdfFit'); if (fit) fit.classList.remove('bg-cyan-500');
    buildPdfPageList();
  };
  window.togglePdfFitWidth = () => { activePdfFitWidth = !activePdfFitWidth; const b = document.getElementById('uniPdfFit'); if (b) b.classList.toggle('bg-cyan-500', activePdfFitWidth); buildPdfPageList(); };
  function pdfEscapeHandler(e) { if (e.key === 'Escape') window.closePdfFullscreen(); }
  window.closePdfFullscreen = () => {
    const overlay = document.getElementById('uniPdfFullscreen'); if (!overlay) return;
    if (activePdfObserver) { activePdfObserver.disconnect(); activePdfObserver = null; }
    activePdfGeneration++;
    activePdfRenderTasks.forEach(task => { try { task.cancel(); } catch (_) {} }); activePdfRenderTasks.clear();
    if (document.fullscreenElement) document.exitFullscreen?.().catch?.(() => {});
    overlay.remove(); document.body.style.overflow = ''; window.removeEventListener('keydown', pdfEscapeHandler);
    if (pdfLocalUrl) { URL.revokeObjectURL(pdfLocalUrl); pdfLocalUrl = null; }
    try { activePdfJsDocument?.destroy(); } catch (_) {}
    activePdfJsDocument = null; activePdfPages = []; activePdfLastId = null;
    if (currentModule === 'pdfreader') renderCurrentModule();
  };
  window.togglePdfFullscreen = async () => {
    const overlay = document.getElementById('uniPdfFullscreen'); if (!overlay) return;
    try { if (!document.fullscreenElement) await overlay.requestFullscreen(); else await document.exitFullscreen(); }
    catch (_) { showToast('Use your browser full-screen shortcut (F11) if full screen is unavailable.', 'info'); }
  };
  window.addEventListener('resize', () => {
    if (document.getElementById('uniPdfFullscreen') && activePdfJsDocument && activePdfFitWidth) {
      clearTimeout(window.__uniPdfResizeTimer); window.__uniPdfResizeTimer = setTimeout(buildPdfPageList, 180);
    }
  });
  window.removeAcademicPdf = async id => {
    const doc = appState.documents.find(d => d.id === id); if (!doc) return;
    if (!confirm(`Remove “${doc.name}” from your PDF library?`)) return;
    await permanentlyDeleteDoc(id);
    if (currentModule === 'pdfreader') renderCurrentModule();
  };
  window.saveAcademicPdfDraft = text => { appState.pdfReaderText = String(text || ''); saveState(); };
  window.displayAcademicPdfText = () => {
    const input = document.getElementById('academicPdfText'), title = document.getElementById('academicPdfTextTitle'), out = document.getElementById('academicPdfTextOutput');
    if (!input || !input.value.trim()) { showToast('Paste some PDF text first.', 'info'); return; }
    appState.pdfReaderText = input.value; appState.pdfReaderTitle = title?.value.trim() || 'PDF text'; saveState();
    out.textContent = input.value; out.classList.remove('hidden');
  };
  window.searchAcademicPdfText = query => {
    appState.pdfReaderSearch = String(query || '');
    const result = document.getElementById('academicPdfSearchResults'), text = appState.pdfReaderText || document.getElementById('academicPdfText')?.value || '';
    if (!result) return;
    if (!query.trim()) { result.textContent = ''; return; }
    const lines = text.split(/\r?\n/), matches = lines.map((line, i) => ({ line, i })).filter(x => x.line.toLowerCase().includes(query.toLowerCase()));
    result.textContent = `${matches.length} matching line(s)${matches.length ? ': ' + matches.slice(0, 5).map(x => `Line ${x.i + 1}`).join(', ') : ''}`;
  };
  window.clearAcademicPdfText = () => { appState.pdfReaderText = ''; appState.pdfReaderTitle = ''; appState.pdfReaderSearch = ''; saveState(); renderCurrentModule(); };
  window.saveAcademicPdfTextAsNote = () => {
    const text = document.getElementById('academicPdfText')?.value || appState.pdfReaderText || '';
    const title = document.getElementById('academicPdfTextTitle')?.value.trim() || appState.pdfReaderTitle || 'PDF reading notes';
    if (!text.trim()) { showToast('There is no PDF text to save.', 'info'); return; }
    const note = { id: uid('note'), title, courseCode: 'GENERAL', folder: 'Lecture Notes', content: text, updatedAt: new Date().toISOString(), deleted: false };
    appState.notes.unshift(note); appState.pdfReaderText = text; appState.pdfReaderTitle = title; saveState();
    showToast('PDF text saved as a lecture note.'); navigateTo('notes');
  };
  window.importAcademicPdf = async event => {
    const file = event.target.files?.[0]; if (!file) return;
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) { showToast('Please choose a valid PDF file.', 'error'); event.target.value = ''; return; }
    try {
      const buffer = await file.arrayBuffer();
      if (buffer.byteLength < 5 || new TextDecoder().decode(new Uint8Array(buffer.slice(0,5))) !== '%PDF-') throw new Error('The selected file does not contain a valid PDF header.');
      const id = uid('pdf'); await savePdfBlob(id, buffer, 'application/pdf');
      const kb = Math.round(file.size / 1024), sizeLabel = kb > 1024 ? `${(kb / 1024).toFixed(1)} MB` : `${kb} KB`;
      appState.documents.unshift({ id, name: file.name, courseCode: 'GENERAL', folder: 'Lecture Notes', sizeLabel, uploadedAt: new Date().toISOString(), isBuiltIn: false, deleted: false });
      saveState(); showToast('PDF imported and saved offline.'); if (currentModule !== 'pdfreader') navigateTo('pdfreader'); else renderCurrentModule(); await launchPdfFullscreen(id);
    } catch (error) { console.error(error); showToast(`PDF import failed: ${error.message}`, 'error'); }
    finally { event.target.value = ''; }
  };
  window.openSavedAcademicPdf = async () => {
    const id = document.getElementById('savedAcademicPdf')?.value;
    if (!id) { showToast('Choose a saved PDF first.', 'info'); return; }
    await launchPdfFullscreen(id);
  };

  // ---------------------------------------------------------------------------
  // Academic Intelligence dashboard: actual CGPA/GPA plus assessment signals
  // ---------------------------------------------------------------------------
  window.renderDashboard = function() {
    const base = originalRenderDashboard();
    const all = getCourses(), cgpa = AcademicEngine.calculateCGPA();
    const currentSem = appState.semesters.find(s => s.id === appState.profile.currentSemesterId) || appState.semesters[appState.semesters.length - 1];
    const semGpa = currentSem ? AcademicEngine.calculateSemesterGPA(currentSem) : { gpa: 0 };
    const pendingTasks = appState.tasks.filter(t => !t.completed);
    const upcoming = [
      ...appState.assessments.filter(a => a.date && (a.score === null || a.score === undefined || a.score === '')).map(a => ({ title: a.name, date: a.date, kind: a.type || 'Assessment' })),
      ...appState.tasks.filter(t => !t.completed && t.dueDate).map(t => ({ title: t.title, date: t.dueDate, kind: 'Assignment' })),
      ...appState.calendarEvents.map(e => ({ title: e.title, date: e.date, kind: e.type || 'Event' }))
    ].filter(x => x.date >= localDateISO()).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 6);
    const totalAttendance = appState.attendance.length, attended = appState.attendance.filter(a => a.status === 'attended').length;
    const performance = all.map(c => { const s = assessmentStats(c.id); return { c, s, grade: s.completedMax ? gradeForPercent(s.completedPercent).grade : (c.grade || '—') }; });
    const lowAttendance = all.map(c => ({ c, s: attendanceStats(c.id) })).filter(x => x.s.rows.length && x.s.percent < x.s.target);
    const panel = `<section class="glass-card rounded-2xl p-4 sm:p-5 space-y-4">
      <div><h3 class="text-lg font-bold text-white">Academic Intelligence</h3><p class="text-xs text-slate-400">A live overview of your GPA, course marks, attendance and upcoming academic work.</p></div>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3"><div class="rounded-xl bg-slate-900/70 p-3"><p class="text-xs text-slate-500">Current CGPA</p><b class="text-xl text-white">${Number(cgpa.cgpa || 0).toFixed(2)} / ${esc(appState.gradingConfig.system)}</b></div><div class="rounded-xl bg-slate-900/70 p-3"><p class="text-xs text-slate-500">Current semester GPA</p><b class="text-xl text-white">${Number(semGpa.gpa || 0).toFixed(2)}</b></div><div class="rounded-xl bg-slate-900/70 p-3"><p class="text-xs text-slate-500">Open tasks</p><b class="text-xl text-white">${pendingTasks.length}</b></div><div class="rounded-xl bg-slate-900/70 p-3"><p class="text-xs text-slate-500">Attendance overall</p><b class="text-xl text-white">${totalAttendance ? (attended / totalAttendance * 100).toFixed(1) + '%' : '—'}</b></div></div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5"><div><h4 class="font-semibold text-white text-sm mb-2">Course performance</h4>${performance.length ? performance.map(x => `<div class="border-t border-slate-800 py-2"><div class="flex justify-between gap-2 text-xs"><span class="text-slate-300">${esc(x.c.code)} · ${esc(x.c.title)}</span><b class="text-accent">${esc(x.grade)}${x.s.completedMax ? ` · ${x.s.completedPercent.toFixed(1)}% on marked components` : ''}</b></div>${x.s.max ? `<div class="h-1.5 bg-slate-800 rounded-full mt-2"><div class="h-1.5 bg-accent rounded-full" style="width:${Math.max(0,Math.min(100,x.s.percent))}%"></div></div><p class="text-[10px] text-slate-500 mt-1">${x.s.earned.toFixed(1)} earned · ${x.s.pending.toFixed(1)} pending marks</p>` : ''}</div>`).join('') : '<p class="text-xs text-slate-500">Add courses to see performance.</p>'}</div>
      <div><h4 class="font-semibold text-white text-sm mb-2">Upcoming deadlines</h4>${upcoming.length ? upcoming.map(x => `<div class="border-t border-slate-800 py-2 flex justify-between gap-2 text-xs"><span class="text-slate-200">${esc(x.title)} <span class="text-slate-500">· ${esc(x.kind)}</span></span><b class="text-amber-300 whitespace-nowrap">${esc(x.date)}</b></div>`).join('') : '<p class="text-xs text-slate-500">No upcoming dated work.</p>'}<h4 class="font-semibold text-white text-sm mt-4 mb-2">Attendance warnings</h4>${lowAttendance.length ? lowAttendance.map(x => `<p class="text-xs text-rose-300 border-t border-slate-800 py-2">${esc(x.c.code)} is at ${x.s.percent.toFixed(1)}% (target ${x.s.target}%).</p>`).join('') : '<p class="text-xs text-emerald-400">No course is currently below its attendance target.</p>'}</div></div>
      <div class="flex flex-wrap gap-3 pt-2">${actionButton('CA & grades →', "navigateTo('assessments')")}${actionButton('Attendance →', "navigateTo('attendance')")}${actionButton('Calendar →', "navigateTo('calendar')")}${actionButton('Grade targets →', "navigateTo('targets')")}</div>
    </section>`;
    return base.replace(/<\/div>\s*$/, panel + '</div>');
  };

  // ---------------------------------------------------------------------------
  // Lifecycle integration, persistence, backup restore and safe cascades
  // ---------------------------------------------------------------------------
  window.renderCurrentModule = function() {
    ensureExtensionState();
    const box = document.getElementById('appContent');
    if (!box) return;
    switch (currentModule) {
      case 'assessments': box.innerHTML = renderAssessments(); break;
      case 'attendance': box.innerHTML = renderAttendance(); break;
      case 'calendar': box.innerHTML = renderCalendar(); break;
      case 'targets': box.innerHTML = renderTargets(); setTimeout(window.calculateAcademicTarget, 0); break;
      case 'pdfreader': box.innerHTML = renderPdfReader(); break;
      default: originalRenderCurrent(); return;
    }
    updateGlobalChrome();
  };
  window.deleteCourse = function(semesterId, courseId) {
    const sem = appState.semesters.find(s => s.id === semesterId), course = sem?.courses.find(c => c.id === courseId);
    if (!sem || !course) return;
    if (!confirm(`Delete ${course.code} and its linked assessment and attendance records?`)) return;
    sem.courses = sem.courses.filter(c => c.id !== courseId);
    appState.assessments = appState.assessments.filter(a => a.courseId !== courseId);
    appState.attendance = appState.attendance.filter(a => a.courseId !== courseId);
    delete appState.attendanceTargets[courseId];
    saveState(); renderCurrentModule(); showToast('Course and linked academic records deleted.', 'info');
  };
  window.deleteSemester = function(semesterId) {
    if (appState.semesters.length <= 1) { showToast('At least one semester must remain.', 'info'); return; }
    const sem = appState.semesters.find(s => s.id === semesterId); if (!sem) return;
    if (!confirm(`Delete ${sem.name} and all its courses and linked assessment/attendance records?`)) return;
    const ids = new Set((sem.courses || []).map(c => c.id));
    appState.semesters = appState.semesters.filter(s => s.id !== semesterId);
    appState.assessments = appState.assessments.filter(a => !ids.has(a.courseId));
    appState.attendance = appState.attendance.filter(a => !ids.has(a.courseId));
    ids.forEach(id => delete appState.attendanceTargets[id]);
    if (appState.profile.currentSemesterId === semesterId) appState.profile.currentSemesterId = appState.semesters[0].id;
    gpaSelectedSemesterId = appState.profile.currentSemesterId; saveState(); renderCurrentModule(); showToast('Semester and linked academic records deleted.', 'info');
  };
  window.handleRestoreJsonBackup = async function(event) { await originalRestore(event); ensureExtensionState(); saveState(); renderCurrentModule(); };
  window.resetToDemoData = async function() { await originalReset(); ensureExtensionState(); saveState(); renderCurrentModule(); };

  // Install periodic academic reminders only once, in addition to existing task alerts.
  if (!window.__unipilotAcademicReminderTimer) {
    window.__unipilotAcademicReminderTimer = setInterval(checkAcademicReminders, 30000);
    window.addEventListener('focus', checkAcademicReminders);
    window.addEventListener('pageshow', checkAcademicReminders);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkAcademicReminders(); });
  }
  window.addEventListener('beforeunload', () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (_) {} if (pdfLocalUrl) URL.revokeObjectURL(pdfLocalUrl); });
})();

</script>
<script>

(() => {
  'use strict';
  const iconFlash = '<path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 014 15.5v-10zM4 15.5A2.5 2.5 0 016.5 13H20M8 7h8M8 10h5"/>';
  const iconHabit = '<path stroke-linecap="round" stroke-linejoin="round" d="M5 3v3m14-3v3M4 8h16M5 5h14a1 1 0 011 1v13H4V6a1 1 0 011-1zm3 8l2 2 5-5"/>';
  if (!NAV_ITEMS.some(x => x.id === 'flashcards')) NAV_ITEMS.push({ id: 'flashcards', label: 'Flashcards & Recall', icon: iconFlash });
  if (!NAV_ITEMS.some(x => x.id === 'habits')) NAV_ITEMS.push({ id: 'habits', label: 'Study Habits', icon: iconHabit });

  appState.flashcards = Array.isArray(appState.flashcards) ? appState.flashcards : [];
  appState.habits = Array.isArray(appState.habits) ? appState.habits : [];
  let activeDeck = 'All decks';
  let reviewQueue = [];
  let reviewIndex = 0;
  let reviewRevealed = false;
  let reviewSessionCount = 0;

  const hEsc = v => escapeHtml(String(v ?? ''));
  const today = () => localDateISO();
  const dayMs = 86400000;
  const parseDay = value => { const [y,m,d] = String(value || '').split('-').map(Number); return y && m && d ? new Date(y,m-1,d).getTime() : NaN; };
  const daysBetween = (a,b) => Math.round((parseDay(b)-parseDay(a))/dayMs);
  const datePlus = (date,n) => { const d = new Date(parseDay(date)); d.setDate(d.getDate()+n); return localDateISO(d); };
  const decks = () => [...new Set(appState.flashcards.map(c => c.deck || 'General'))].sort((a,b)=>a.localeCompare(b));
  const dueCards = () => appState.flashcards.filter(c => !c.nextReview || c.nextReview <= today());
  const cardById = id => appState.flashcards.find(c => c.id === id);
  const action = (label, fn, cls='') => `<button type="button" onclick="${fn}" class="text-xs font-semibold ${cls || 'text-accent'} hover:underline">${label}</button>`;

  function flashcardForm(id='') {
    const card = id ? cardById(id) : null;
    openModal(`<h3 class="text-lg font-bold text-white mb-4">${card ? 'Edit' : 'Create'} flashcard</h3>
      <form onsubmit="saveUniFlashcard(event,'${hEsc(id)}')" class="space-y-3">
        <label class="block text-xs text-slate-400">Deck / course<input name="deck" required maxlength="60" class="input-field mt-1" value="${hEsc(card?.deck || (activeDeck !== 'All decks' ? activeDeck : 'General'))}" placeholder="e.g. BIO 101"></label>
        <label class="block text-xs text-slate-400">Question / front<textarea name="front" required maxlength="2000" rows="3" class="input-field mt-1" placeholder="Write a question, definition or concept">${hEsc(card?.front || '')}</textarea></label>
        <label class="block text-xs text-slate-400">Answer / back<textarea name="back" required maxlength="4000" rows="4" class="input-field mt-1" placeholder="Write the answer or explanation">${hEsc(card?.back || '')}</textarea></label>
        <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-400">Cancel</button><button class="btn-accent rounded-xl px-4 py-2">Save flashcard</button></div>
      </form>`, 'max-w-2xl');
  }
  window.openUniFlashcardForm = flashcardForm;
  window.saveUniFlashcard = (event,id='') => {
    event.preventDefault(); const f = new FormData(event.target);
    const deck = String(f.get('deck')||'').trim(), front = String(f.get('front')||'').trim(), back = String(f.get('back')||'').trim();
    if (!deck || !front || !back) { showToast('Complete the deck, question and answer fields.', 'error'); return; }
    const old = id ? cardById(id) : null;
    const record = old ? {...old, deck, front, back} : { id: uid('fc'), deck, front, back, createdAt: today(), nextReview: today(), interval: 0, ease: 2.5, reps: 0, reviews: 0 };
    if (old) appState.flashcards = appState.flashcards.map(c=>c.id===id?record:c); else appState.flashcards.push(record);
    activeDeck = deck; saveState(); closeModal(); renderCurrentModule(); showToast(old ? 'Flashcard updated.' : 'Flashcard added.');
  };
  window.deleteUniFlashcard = id => { if (!cardById(id) || !confirm('Delete this flashcard and its review schedule?')) return; appState.flashcards=appState.flashcards.filter(c=>c.id!==id); saveState(); renderCurrentModule(); showToast('Flashcard deleted.','info'); };
  window.setUniFlashDeck = deck => { activeDeck=deck; renderCurrentModule(); };
  window.startUniFlashReview = () => {
    const pool = dueCards().filter(c=>activeDeck==='All decks'||(c.deck||'General')===activeDeck);
    reviewQueue = pool.map(c=>c.id); reviewIndex=0; reviewRevealed=false; reviewSessionCount=0;
    renderCurrentModule();
  };
  window.revealUniFlashAnswer = () => { reviewRevealed=true; renderCurrentModule(); };
  window.rateUniFlashcard = rating => {
    const card = cardById(reviewQueue[reviewIndex]); if (!card) return;
    const oldInterval = Math.max(0, Number(card.interval)||0);
    if (rating === 'again') { card.interval=0; card.reps=0; card.ease=Math.max(1.3,(Number(card.ease)||2.5)-0.2); card.nextReview=today(); }
    else if (rating === 'hard') { card.interval=Math.max(1,Math.round((oldInterval||1)*1.2)); card.reps=(Number(card.reps)||0)+1; card.ease=Math.max(1.3,(Number(card.ease)||2.5)-0.15); card.nextReview=datePlus(today(),card.interval); }
    else if (rating === 'good') { card.interval=oldInterval===0?1:Math.max(2,Math.round(oldInterval*(Number(card.ease)||2.5))); card.reps=(Number(card.reps)||0)+1; card.nextReview=datePlus(today(),card.interval); }
    else { card.interval=oldInterval===0?3:Math.max(3,Math.round(oldInterval*(Number(card.ease)||2.5)*1.3)); card.reps=(Number(card.reps)||0)+1; card.ease=Math.min(3.2,(Number(card.ease)||2.5)+0.1); card.nextReview=datePlus(today(),card.interval); }
    card.reviews=(Number(card.reviews)||0)+1; card.lastReviewed=today(); reviewSessionCount++;
    reviewIndex++; reviewRevealed=false; saveState(); renderCurrentModule();
  };

  function renderFlashcards() {
    const all = activeDeck==='All decks' ? appState.flashcards : appState.flashcards.filter(c=>(c.deck||'General')===activeDeck);
    const due = dueCards().filter(c=>activeDeck==='All decks'||(c.deck||'General')===activeDeck).length;
    const mastered = all.filter(c=>Number(c.interval)>=21).length;
    const isReview = reviewQueue.length > 0;
    const current = isReview ? cardById(reviewQueue[reviewIndex]) : null;
    const deckOptions = ['All decks',...decks()].map(d=>`<option value="${hEsc(d)}" ${activeDeck===d?'selected':''}>${hEsc(d)}</option>`).join('');
    const top = `<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h2 class="text-xl sm:text-2xl font-bold text-white">Flashcards & Active Recall</h2><p class="text-xs text-slate-400 mt-1">Build memory with short reviews that return at spaced intervals.</p></div><button onclick="openUniFlashcardForm()" class="btn-accent rounded-xl px-4 py-2.5 text-xs font-semibold">＋ Create flashcard</button></div>`;
    if (isReview && current) {
      return `<div class="max-w-3xl mx-auto space-y-5 module-enter">${top}<div class="flex items-center justify-between text-xs text-slate-400"><span>Review session · ${reviewIndex+1} of ${reviewQueue.length}</span><span>${reviewSessionCount} reviewed this session</span></div><div class="h-1.5 rounded-full bg-slate-800 overflow-hidden"><div class="h-full bg-accent rounded-full" style="width:${(reviewIndex/reviewQueue.length)*100}%"></div></div><section class="glass-card rounded-3xl p-6 sm:p-10 min-h-[280px] flex flex-col justify-center text-center"><p class="text-[10px] uppercase tracking-[.2em] text-accent font-bold">${hEsc(current.deck||'General')} · ${reviewRevealed?'Answer':'Question'}</p><div class="text-lg sm:text-2xl font-semibold text-white leading-relaxed whitespace-pre-wrap mt-6">${hEsc(reviewRevealed?current.back:current.front)}</div>${!reviewRevealed?'<button onclick="revealUniFlashAnswer()" class="btn-accent rounded-xl px-6 py-3 mt-8 self-center">Show answer</button>':'<p class="text-xs text-slate-500 mt-7">How well did you recall it?</p><div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4"><button onclick="rateUniFlashcard(\'again\')" class="rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-300 py-3 text-xs font-semibold">Again <small class="block opacity-70">Review today</small></button><button onclick="rateUniFlashcard(\'hard\')" class="rounded-xl border border-amber-500/30 bg-amber-500/10 text-amber-300 py-3 text-xs font-semibold">Hard <small class="block opacity-70">Short interval</small></button><button onclick="rateUniFlashcard(\'good\')" class="rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 py-3 text-xs font-semibold">Good <small class="block opacity-70">Normal interval</small></button><button onclick="rateUniFlashcard(\'easy\')" class="rounded-xl border border-cyan-500/30 bg-cyan-500/10 text-cyan-300 py-3 text-xs font-semibold">Easy <small class="block opacity-70">Longer interval</small></button></div>'}</section><div class="text-center">${action('End review', 'endUniFlashReview()', 'text-slate-400')}</div></div>`;
    }
    if (reviewQueue.length && reviewIndex>=reviewQueue.length) {
      const completed=reviewSessionCount; reviewQueue=[]; reviewIndex=0;
      return `<div class="max-w-2xl mx-auto space-y-5 module-enter">${top}<section class="glass-card rounded-3xl p-8 text-center"><div class="text-4xl mb-3">✦</div><h3 class="text-2xl font-bold text-white">Review complete</h3><p class="text-sm text-slate-400 mt-2">You reviewed ${completed} card(s). Keep coming back to strengthen long-term recall.</p><button onclick="startUniFlashReview()" class="btn-accent rounded-xl px-5 py-2.5 mt-6">Review remaining cards</button></section></div>`;
    }
    const rows = all.slice().sort((a,b)=>(a.nextReview||'').localeCompare(b.nextReview||'')).map(c=>`<article class="rounded-xl border border-slate-800 bg-slate-900/50 p-3"><div class="flex justify-between gap-3"><div class="min-w-0"><p class="text-[10px] uppercase tracking-wider text-accent">${hEsc(c.deck||'General')}</p><p class="text-sm text-white mt-1 whitespace-pre-wrap">${hEsc(c.front)}</p><p class="text-xs text-slate-500 mt-2">Next review: ${hEsc(c.nextReview||'Today')} · ${Number(c.reviews)||0} reviews</p></div><div class="flex gap-3 shrink-0">${action('Edit',`openUniFlashcardForm('${c.id}')`)}${action('Delete',`deleteUniFlashcard('${c.id}')`,'text-rose-400')}</div></div></article>`).join('');
    return `<div class="space-y-5 module-enter">${top}<section class="grid grid-cols-2 sm:grid-cols-4 gap-3"><div class="glass-card rounded-2xl p-4"><p class="text-xs text-slate-500">Cards in deck</p><b class="text-2xl text-white">${all.length}</b></div><div class="glass-card rounded-2xl p-4"><p class="text-xs text-slate-500">Due today</p><b class="text-2xl text-amber-300">${due}</b></div><div class="glass-card rounded-2xl p-4"><p class="text-xs text-slate-500">Long-term</p><b class="text-2xl text-emerald-300">${mastered}</b><p class="text-[10px] text-slate-500">21+ day interval</p></div><div class="glass-card rounded-2xl p-4"><p class="text-xs text-slate-500">Total reviews</p><b class="text-2xl text-white">${all.reduce((n,c)=>n+(Number(c.reviews)||0),0)}</b></div></section><section class="glass-card rounded-2xl p-4 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between"><label class="text-xs text-slate-400 flex items-center gap-2">Deck<select onchange="setUniFlashDeck(this.value)" class="input-field min-w-[170px]">${deckOptions}</select></label><button onclick="startUniFlashReview()" ${due?'':'disabled'} class="btn-accent rounded-xl px-5 py-2.5 text-xs font-semibold disabled:opacity-40">Start review · ${due} due</button></section><div class="flex items-center justify-between"><h3 class="font-bold text-white">Your cards</h3><span class="text-xs text-slate-500">${all.length} total</span></div>${rows?`<div class="grid grid-cols-1 lg:grid-cols-2 gap-3">${rows}</div>`:`<div class="glass-card rounded-2xl p-8 text-center"><p class="text-white font-semibold">Your first deck starts here</p><p class="text-xs text-slate-400 mt-2">Create flashcards from lecture notes, definitions, formulas and past questions.</p><button onclick="openUniFlashcardForm()" class="btn-accent rounded-xl px-4 py-2 mt-4 text-xs">Create first card</button></div>`}<p class="text-[11px] text-slate-500">Scheduling is stored locally on this device. Use your UniPilot backup to move flashcards and review progress to another device.</p></div>`;
  }
  window.endUniFlashReview = () => { reviewQueue=[]; reviewIndex=0; reviewRevealed=false; renderCurrentModule(); };

  function habitStreak(habit) {
    const set=new Set(habit.completedDates||[]); let cursor=today();
    if (!set.has(cursor)) cursor=datePlus(cursor,-1);
    let streak=0; while(set.has(cursor) && streak<3660){streak++;cursor=datePlus(cursor,-1);} return streak;
  }
  function habitForm() {
    openModal(`<h3 class="text-lg font-bold text-white mb-4">Create a study habit</h3><form onsubmit="saveUniHabit(event)" class="space-y-3"><label class="block text-xs text-slate-400">Habit name<input name="name" required maxlength="70" class="input-field mt-1" placeholder="e.g. Review lecture notes"></label><label class="block text-xs text-slate-400">Weekly target<select name="target" class="input-field mt-1">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${n===5?'selected':''}>${n} day(s) per week</option>`).join('')}</select></label><div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-400">Cancel</button><button class="btn-accent rounded-xl px-4 py-2">Create habit</button></div></form>`);
  }
  window.openUniHabitForm=habitForm;
  window.saveUniHabit=event=>{event.preventDefault();const f=new FormData(event.target),name=String(f.get('name')||'').trim(),target=Math.max(1,Math.min(7,Number(f.get('target'))||5));if(!name)return;appState.habits.push({id:uid('habit'),name,target,createdAt:today(),completedDates:[]});saveState();closeModal();renderCurrentModule();showToast('Study habit created.');};
  window.toggleUniHabit=id=>{const h=appState.habits.find(x=>x.id===id);if(!h)return;const d=today(),set=new Set(h.completedDates||[]);if(set.has(d))set.delete(d);else set.add(d);h.completedDates=[...set].sort();saveState();renderCurrentModule();};
  window.deleteUniHabit=id=>{if(!confirm('Delete this habit and its check-in history?'))return;appState.habits=appState.habits.filter(h=>h.id!==id);saveState();renderCurrentModule();showToast('Habit deleted.','info');};
  function renderHabits(){
    const d=today(),start=datePlus(d,-((new Date().getDay()+6)%7)),week=Array.from({length:7},(_,i)=>datePlus(start,i));
    const checkedToday=appState.habits.filter(h=>(h.completedDates||[]).includes(d)).length;
    const totalWeek=appState.habits.reduce((n,h)=>n+(h.completedDates||[]).filter(x=>x>=start&&x<=d).length,0);
    const cards=appState.habits.map(h=>{const set=new Set(h.completedDates||[]),weekCount=week.filter(x=>set.has(x)).length,done=set.has(d),streak=habitStreak(h),progress=Math.min(100,weekCount/Math.max(1,Number(h.target)||5)*100);return `<article class="glass-card rounded-2xl p-4 space-y-3"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><h3 class="font-semibold text-white">${hEsc(h.name)}</h3><p class="text-xs text-slate-500 mt-1">${streak} day streak · ${weekCount}/${h.target||5} days this week</p></div><div class="flex gap-3">${action('Delete',`deleteUniHabit('${h.id}')`,'text-rose-400')}</div></div><div class="grid grid-cols-7 gap-1.5">${week.map((date,i)=>`<div class="text-center"><p class="text-[9px] text-slate-500 mb-1">${['M','T','W','T','F','S','S'][i]}</p><div class="h-8 rounded-lg flex items-center justify-center text-[10px] ${set.has(date)?'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30':'bg-slate-900 text-slate-600 border border-slate-800'}">${set.has(date)?'✓':String(new Date(parseDay(date)).getDate())}</div></div>`).join('')}</div><div class="h-1.5 rounded-full bg-slate-800 overflow-hidden"><div class="h-full bg-accent rounded-full" style="width:${progress}%"></div></div><div class="flex items-center justify-between gap-2"><span class="text-[10px] text-slate-500">Weekly goal progress · ${Math.round(progress)}%</span><button onclick="toggleUniHabit('${h.id}')" class="rounded-xl px-3 py-2 text-xs font-semibold ${done?'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30':'btn-accent'}">${done?'✓ Done today · Undo':'Check in today'}</button></div></article>`;}).join('');
    return `<div class="space-y-5 module-enter"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h2 class="text-xl sm:text-2xl font-bold text-white">Study Habits</h2><p class="text-xs text-slate-400 mt-1">Build a consistent routine through small daily check-ins.</p></div><button onclick="openUniHabitForm()" class="btn-accent rounded-xl px-4 py-2.5 text-xs font-semibold">＋ Add habit</button></div><section class="grid grid-cols-2 sm:grid-cols-3 gap-3"><div class="glass-card rounded-2xl p-4"><p class="text-xs text-slate-500">Habits tracked</p><b class="text-2xl text-white">${appState.habits.length}</b></div><div class="glass-card rounded-2xl p-4"><p class="text-xs text-slate-500">Completed today</p><b class="text-2xl text-emerald-300">${checkedToday}/${appState.habits.length}</b></div><div class="glass-card rounded-2xl p-4 col-span-2 sm:col-span-1"><p class="text-xs text-slate-500">Check-ins this week</p><b class="text-2xl text-white">${totalWeek}</b></div></section>${cards?`<div class="grid grid-cols-1 xl:grid-cols-2 gap-3">${cards}</div>`:`<div class="glass-card rounded-2xl p-8 text-center"><h3 class="font-semibold text-white">Start with one small habit</h3><p class="text-xs text-slate-400 mt-2">Examples: revise for 20 minutes, solve five problems, read one lecture section or review flashcards.</p><button onclick="openUniHabitForm()" class="btn-accent rounded-xl px-4 py-2 mt-4 text-xs">Create your first habit</button></div>`}<p class="text-[11px] text-slate-500">Your check-ins are private and stored in this browser. Streaks are based on consecutive local calendar days.</p></div>`;
  }

  const previousRender=window.renderCurrentModule;
  window.renderCurrentModule=function(){
    if(currentModule==='flashcards'){const box=document.getElementById('appContent');if(box)box.innerHTML=renderFlashcards();updateGlobalChrome();return;}
    if(currentModule==='habits'){const box=document.getElementById('appContent');if(box)box.innerHTML=renderHabits();updateGlobalChrome();return;}
    return previousRender.apply(this,arguments);
  };
})();
</script>
<script>
/* UniPilot identity layer: developer profile and app identity. */
(() => {
  'use strict';
  const aboutIcon = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-4m0-4h.01M22 12a10 10 0 11-20 0 10 10 0 0120 0z"/>';
  if (typeof NAV_ITEMS !== 'undefined' && !NAV_ITEMS.some(item => item.id === 'about')) {
    NAV_ITEMS.push({ id: 'about', label: 'About Developer', icon: aboutIcon });
  }
  const previousRender = window.renderCurrentModule;
  function renderAboutDeveloper() {
    return `<div class="max-w-4xl mx-auto space-y-6 module-enter">
      <section class="glass-card rounded-3xl overflow-hidden border border-slate-700/70">
        <div class="relative p-7 sm:p-10 bg-gradient-to-br from-indigo-950/90 via-slate-900 to-cyan-950/70">
          <div class="absolute inset-0 opacity-20" style="background:radial-gradient(circle at 85% 15%,#22d3ee,transparent 35%),radial-gradient(circle at 10% 100%,#6366f1,transparent 38%)"></div>
          <div class="relative flex flex-col sm:flex-row items-center sm:items-start gap-6">
            <div class="w-28 h-28 rounded-3xl bg-slate-950/70 border border-cyan-300/30 p-2 shadow-2xl shadow-cyan-950/40 shrink-0">
              <img src="${document.querySelector('link[rel=icon]')?.href || ''}" alt="UniPilot app logo" class="w-full h-full object-contain" />
            </div>
            <div class="text-center sm:text-left">
              <p class="text-xs uppercase tracking-[.24em] text-cyan-300 font-bold">About the application</p>
              <h2 class="text-3xl sm:text-4xl font-extrabold text-white mt-2">UniPilot</h2>
              <p class="text-slate-300 mt-2 max-w-xl">Your academic life, under control. A personal workspace for planning, tracking and managing your academic journey.</p>
              <span class="inline-flex mt-4 px-3 py-1.5 rounded-full text-xs font-semibold bg-cyan-400/10 border border-cyan-300/25 text-cyan-200">Academic Command OS</span>
            </div>
          </div>
        </div>
        <div class="p-6 sm:p-8 grid sm:grid-cols-[1fr_1.3fr] gap-6">
          <div class="rounded-2xl bg-slate-900/70 border border-slate-700/70 p-5">
            <p class="text-xs uppercase tracking-widest text-slate-500 font-bold">Developer</p>
            <h3 class="text-2xl font-bold text-white mt-2">Prudent</h3>
            <p class="text-sm text-accent mt-1">Engineering Student</p>
            <p class="text-sm text-slate-300 mt-2">University of Benin</p>
          </div>
          <div class="space-y-3">
            <h3 class="text-lg font-bold text-white">Built to support your academic journey</h3>
            <p class="text-sm leading-7 text-slate-400">UniPilot brings academic planning and progress tracking together in one place. Use it to manage courses, monitor grades, plan study sessions, organise deadlines, track attendance and keep learning materials close at hand.</p>
            <div class="grid grid-cols-2 gap-2 pt-1">
              ${['GPA & CGPA tracking','CA and grade management','Attendance monitoring','Academic calendar','Study planning','PDF study library','Spaced-repetition flashcards','Study habit tracking'].map(x => '<div class="rounded-xl bg-slate-900/60 border border-slate-800 p-3 text-xs text-slate-300"><span class="text-cyan-300 mr-2">✦</span>' + x + '</div>').join('')}
            </div>
          </div>
        </div>
      </section>
      <p class="text-center text-xs text-slate-500">UniPilot · Made to make academic organisation simpler.</p>
    </div>`;
  }
  window.renderCurrentModule = function() {
    if (typeof currentModule !== 'undefined' && currentModule === 'about') {
      const box = document.getElementById('appContent');
      if (box) box.innerHTML = renderAboutDeveloper();
      if (typeof updateGlobalChrome === 'function') updateGlobalChrome();
      return;
    }
    if (typeof previousRender === 'function') return previousRender();
  };
  window.navigateTo = (function(original) {
    return function(id) { return original.call(this, id); };
  })(window.navigateTo || function(id) {
    currentModule = id; renderSidebar(); window.renderCurrentModule();
  });
  // Add a small brand mark to the browser/app title metadata and accessible image labels.
  document.documentElement.dataset.unipilotBrand = 'prudent';
})();
</script>

<script>
// UniPilot PWA registration. The worker only caches same-origin app-shell resources.
(() => {
  if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .catch(error => console.warn('UniPilot offline support could not be enabled:', error));
  }, { once: true });
})();
</script>
