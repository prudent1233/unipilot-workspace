    :root {
      --accent-hex: #6366f1;
      --accent-rgb: 99 102 241;
      --accent-glow: rgba(99, 102, 241, 0.28);
      --bg-primary: #090d16;
      --bg-secondary: #0f1523;
      --bg-card: rgba(20, 27, 45, 0.78);
      --bg-elevated: rgba(30, 41, 66, 0.85);
      --border-subtle: rgba(148, 163, 184, 0.12);
      --border-accent: rgba(99, 102, 241, 0.35);
    }

    body.theme-charcoal {
      --bg-primary: #0a0a0c;
      --bg-secondary: #121216;
      --bg-card: rgba(24, 24, 30, 0.82);
      --bg-elevated: rgba(36, 36, 44, 0.88);
      --border-subtle: rgba(161, 161, 170, 0.13);
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.22) transparent;
    }

    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.22);
      border-radius: 9999px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.38);
    }

    body {
      background-color: var(--bg-primary);
      color: #f1f5f9;
      font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 15% 12%, rgba(var(--accent-rgb), 0.13), transparent 34%),
        radial-gradient(circle at 88% 82%, rgba(var(--accent-rgb), 0.08), transparent 38%);
      background-attachment: fixed;
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.55), inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .glass-card-hover:hover {
      border-color: rgba(var(--accent-rgb), 0.35);
      box-shadow: 0 14px 34px -10px rgba(0, 0, 0, 0.65), 0 0 24px -6px rgba(var(--accent-rgb), 0.22);
    }

    .accent-glow {
      box-shadow: 0 0 24px -4px rgba(var(--accent-rgb), 0.45);
    }

    .btn-accent {
      background: linear-gradient(135deg, rgb(var(--accent-rgb)), rgba(var(--accent-rgb), 0.82));
      color: #ffffff;
      box-shadow: 0 6px 18px -4px rgba(var(--accent-rgb), 0.48);
      transition: all 0.2s ease;
    }
    .btn-accent:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-accent:active {
      transform: translateY(0);
    }

    .nav-item-active {
      background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.2), rgba(var(--accent-rgb), 0.04));
      border-left: 3px solid rgb(var(--accent-rgb));
      color: #ffffff;
    }

    .input-field {
      background: rgba(9, 13, 22, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: #f8fafc;
      border-radius: 0.75rem;
      padding: 0.6rem 0.85rem;
      font-size: 0.875rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .input-field:focus {
      outline: none;
      border-color: rgb(var(--accent-rgb));
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.2);
    }

    select.input-field option {
      background-color: #0f1523;
      color: #f8fafc;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .module-enter {
      animation: fadeSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #0f172a !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
    }

    // Calendar dates for deadlines are date-only values. Avoid UTC conversion so
    // users west/east of UTC see the same local calendar day they selected.
    function localDateISO(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function addLocalDaysISO(days, from = new Date()) {
      const date = new Date(from.getFullYear(), from.getMonth(), from.getDate());
      date.setDate(date.getDate() + Number(days || 0));
      return localDateISO(date);
    }
    function localDateTimeFromParts(dateValue, timeValue = '23:59') {
      const [year, month, day] = String(dateValue || '').split('-').map(Number);
      const [hour, minute] = String(timeValue || '23:59').split(':').map(Number);
      if (![year, month, day, hour, minute].every(Number.isFinite)) return NaN;
      const date = new Date(year, month - 1, day, hour, minute, 0, 0);
      return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? date.getTime() : NaN;
    }

    // IndexedDB Helper for Real PDF Blobs
    function openFilesDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function savePdfBlob(id, arrayBuffer, mimeType = 'application/pdf') {
      const db = await openFilesDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put({ id, buffer: arrayBuffer, mimeType });
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => { const err = tx.error; db.close(); reject(err); };
        tx.onabort = () => { const err = tx.error; db.close(); reject(err || new Error('PDF storage transaction aborted.')); };
      });
    }

    // A single IndexedDB transaction makes restore all-or-nothing: the old PDF
    // collection remains intact if any write fails.
    async function replacePdfRecords(records) {
      const db = await openFilesDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        store.clear();
        records.forEach(record => store.put(record));
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => { const err = tx.error; db.close(); reject(err); };
        tx.onabort = () => { const err = tx.error; db.close(); reject(err || new Error('PDF restore transaction aborted.')); };
      });
    }

    async function getPdfArrayBuffer(id) {
      const db = await openFilesDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(id);
        req.onsuccess = () => {
          if (!req.result || !req.result.buffer) return resolve(null);
          const value = req.result.buffer;
          resolve(value instanceof ArrayBuffer ? value.slice(0) : value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength));
        };
        req.onerror = () => { db.close(); reject(req.error); };
        tx.oncomplete = () => db.close();
        tx.onerror = () => db.close();
      });
    }

    async function getPdfBlobUrl(id) {
      const db = await openFilesDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(id);
        req.onsuccess = () => {
          if (!req.result) return resolve(null);
          const blob = new Blob([req.result.buffer], { type: req.result.mimeType || 'application/pdf' });
          resolve(URL.createObjectURL(blob));
        };
        req.onerror = () => { db.close(); reject(req.error); };
        tx.oncomplete = () => db.close();
        tx.onerror = () => db.close();
      });
    }

    async function deletePdfBlob(id) {

        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(id);
      } catch (e) { /* ignore */ }

    async function clearFilesDB() {
      const db = await openFilesDB();

    async function listPdfRecords() {

        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).getAll();
        tx.oncomplete = () => { db.close(); resolve(req.result || []); };
        tx.onerror = () => { const err = tx.error || req.error; db.close(); reject(err); };
        tx.onabort = () => { const err = tx.error; db.close(); reject(err || new Error('PDF listing transaction aborted.')); };
      });
    }

    function bytesToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      return btoa(binary);
    }
    function base64ToBuffer(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    function hexToRgbSpace(hex) {
      const clean = hex.replace('#', '');
      const bigint = parseInt(clean, 16);
      if (isNaN(bigint)) return '99 102 241';
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `${r} ${g} ${b}`;
    }

      document.documentElement.style.setProperty('--accent-glow', `rgba(${rgb.replace(/ /g, ', ')}, 0.28)`);

    function playChime() {
      if (!appState.preferences.soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.16); // A5
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.65);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.65);
      } catch (e) { /* AudioContext blocked until interaction */ }
    }

    /* ============================================================================
       3. INDEPENDENT ACADEMIC CALCULATION ENGINE (5.0 & 4.0 SCALES)
    ============================================================================ */
    const AcademicEngine = {
      getGradePoints(grade, system = appState.gradingConfig.system) {
        if (!grade || grade === 'IP') return null;
        const scale = appState.gradingConfig.scales[system] || appState.gradingConfig.scales['5.0'];
        const found = scale.find(s => s.grade.toUpperCase() === grade.toUpperCase());
        return found ? Number(found.points) : null;
      },

      calculateSemesterGPA(semester, system = appState.gradingConfig.system) {
        if (!semester || !semester.courses) return { gpa: 0, totalUnits: 0, gradedUnits: 0, totalPoints: 0 };
        let totalUnits = 0;
        let gradedUnits = 0;
        let totalPoints = 0;

        semester.courses.forEach(c => {
          const u = Number(c.units) || 0;
          totalUnits += u;
          const pts = this.getGradePoints(c.grade, system);
          if (pts !== null) {
            gradedUnits += u;
            totalPoints += u * pts;
          }
        });

        const gpa = gradedUnits > 0 ? totalPoints / gradedUnits : 0;
        return {
          gpa: Number(gpa.toFixed(2)),
          totalUnits,
          gradedUnits,
          totalPoints: Number(totalPoints.toFixed(2))
        };
      },

      calculateCGPA(semesters = appState.semesters, system = appState.gradingConfig.system) {
        let cumUnits = 0;
        let cumPoints = 0;
        let totalRegisteredUnits = 0;

        semesters.forEach(sem => {
          const res = this.calculateSemesterGPA(sem, system);
          cumUnits += res.gradedUnits;
          cumPoints += res.totalPoints;
          totalRegisteredUnits += res.totalUnits;
        });

        const cgpa = cumUnits > 0 ? cumPoints / cumUnits : 0;
        return {
          cgpa: Number(cgpa.toFixed(2)),
          cumUnits,
          cumPoints: Number(cumPoints.toFixed(2)),
          totalRegisteredUnits,
          standing: cumUnits > 0 ? this.getClassOfDegree(cgpa, system) : { label: 'No grades yet', color: 'text-slate-300 bg-slate-500/15 border-slate-500/30' }
        };
      },

      getClassOfDegree(cgpa, system = appState.gradingConfig.system) {
        const rows = appState.gradingConfig.classifications?.[system] || [];
        const row = rows.slice().sort((a,b) => b.min-a.min).find(r => cgpa >= Number(r.min));
        const colors = ['text-emerald-400 bg-emerald-500/15 border-emerald-500/30','text-sky-400 bg-sky-500/15 border-sky-500/30','text-amber-400 bg-amber-500/15 border-amber-500/30','text-orange-400 bg-orange-500/15 border-orange-500/30','text-slate-300 bg-slate-500/15 border-slate-500/30','text-rose-400 bg-rose-500/15 border-rose-500/30'];
        return { label: row?.label || 'Academic Probation', color: colors[Math.max(0, rows.indexOf(row))] || colors[5] };
      },

      projectRequiredGPA(currentCumPoints, currentCumUnits, nextUnits, targetCgpa, system = appState.gradingConfig.system) {
        const maxScale = Number(system);
        if (nextUnits <= 0) return { achievable: false, requiredGpa: 0 };
        const requiredPoints = targetCgpa * (currentCumUnits + nextUnits) - currentCumPoints;
        const requiredGpa = requiredPoints / nextUnits;
        return {
          requiredGpa: Number(requiredGpa.toFixed(2)),
          achievable: requiredGpa <= maxScale && requiredGpa >= 0,
          alreadyMet: requiredGpa <= 0
        };
      }
    };

    ============================================================================ */
    function buildRadialGaugeSVG(value, maxValue, label = 'CGPA') {
      const pct = Math.min(1, Math.max(0, value / maxValue));
      const r = 54;
      const circ = 2 * Math.PI * r;
      const offset = circ * (1 - pct);
      return `
        <div class="relative w-36 h-36 flex items-center justify-center shrink-0">
          <svg class="w-36 h-36 -rotate-90" viewBox="0 0 132 132">
            <defs>
              <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="rgb(var(--accent-rgb))" />
                <stop offset="100%" stop-color="#38bdf8" />
              </linearGradient>
            </defs>
            <circle cx="66" cy="66" r="${r}" stroke="rgba(148,163,184,0.14)" stroke-width="11" fill="none" />
            <circle cx="66" cy="66" r="${r}" stroke="url(#gaugeGrad)" stroke-width="11" stroke-linecap="round"
              stroke-dasharray="${circ}" stroke-dashoffset="${offset}" fill="none"
              style="filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.55)); transition: stroke-dashoffset 0.6s ease;" />
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">${label}</span>
            <span class="text-2xl font-extrabold text-white font-mono">${value.toFixed(2)}</span>
            <span class="text-[10px] text-slate-400">of ${maxValue.toFixed(1)}</span>
          </div>
        </div>
      `;
    }

    function buildAreaChartSVG(labels, values, maxVal = 5.0, height = 190) {
      if (!values.length) return `<div class="h-44 flex items-center justify-center text-xs text-slate-500">No semester trend data yet</div>`;
      const width = 560;
      const padX = 36;
      const padY = 24;
      const innerW = width - padX * 2;
      const innerH = height - padY * 2;

      const points = values.map((val, i) => {
        const x = values.length === 1 ? width / 2 : padX + (i / (values.length - 1)) * innerW;
        const y = padY + innerH - (Math.min(maxVal, Math.max(0, val)) / maxVal) * innerH;
        return { x, y, val, label: labels[i] || '' };
      });

      const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
      const areaPath = `${linePath} L ${points[points.length - 1].x.toFixed(1)} ${(padY + innerH).toFixed(1)} L ${points[0].x.toFixed(1)} ${(padY + innerH).toFixed(1)} Z`;

      const gridLines = [0, 0.25, 0.5, 0.75, 1].map(ratio => {
        const y = padY + innerH * (1 - ratio);
        const tickVal = (maxVal * ratio).toFixed(1);
        return `
          <line x1="${padX}" y1="${y}" x2="${width - padX}" y2="${y}" stroke="rgba(148,163,184,0.1)" stroke-dasharray="3 3" />
          <text x="${padX - 6}" y="${y + 3}" text-anchor="end" fill="#64748b" font-size="9" font-family="JetBrains Mono">${tickVal}</text>
        `;
      }).join('');

      return `
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-auto overflow-visible">
          <defs>
            <linearGradient id="areaFillGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgb(var(--accent-rgb))" stop-opacity="0.38" />
              <stop offset="100%" stop-color="rgb(var(--accent-rgb))" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          ${gridLines}
          ${points.length > 1 ? `<path d="${areaPath}" fill="url(#areaFillGrad)" />` : ''}
          ${points.length > 1 ? `<path d="${linePath}" fill="none" stroke="rgb(var(--accent-rgb))" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />` : ''}
          ${points.map(p => `
            <circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#0f1523" stroke="rgb(var(--accent-rgb))" stroke-width="2.5" />
            <text x="${p.x}" y="${p.y - 10}" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600" font-family="JetBrains Mono">${p.val.toFixed(2)}</text>
            <text x="${p.x}" y="${height - 4}" text-anchor="middle" fill="#94a3b8" font-size="9.5">${escapeHtml(p.label)}</text>
          `).join('')}
        </svg>
      `;
    }

    function handleSaveCountdown(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      appState.examCountdowns.push({
        id: uid('exd'),
        courseCode: fd.get('courseCode').trim().toUpperCase(),
        title: fd.get('title').trim(),
        date: fd.get('date'),
        venue: fd.get('venue').trim()
      });
      logActivity(`Added exam countdown for ${fd.get('courseCode').toUpperCase()}`, 'exam');
      closeModal();
      renderCurrentModule();
      showToast('Examination countdown added!');
    }

    /* ============================================================================
       7. MODULE 2: GPA & CGPA MANAGER (5.0 & 4.0 + SCALE EDITOR + WHAT-IF PROJECTOR)
    ============================================================================ */
    function renderGpaManager() {
      const { gradingConfig, semesters } = appState;
      const system = gradingConfig.system;
      const scaleMax = Number(system);
      const scaleRows = gradingConfig.scales[system];
      const cgpaStats = AcademicEngine.calculateCGPA();

      if (!semesters.find(s => s.id === gpaSelectedSemesterId)) {
        gpaSelectedSemesterId = semesters[0]?.id;
      }
      const activeSem = semesters.find(s => s.id === gpaSelectedSemesterId);
      const activeSemStats = activeSem ? AcademicEngine.calculateSemesterGPA(activeSem) : { gpa: 0, totalUnits: 0, gradedUnits: 0, totalPoints: 0 };

      return `
        <div class="module-enter space-y-6">
          <!-- Header & Grading Scale Switcher -->

            </div>

              <div class="inline-flex p-1 rounded-xl bg-slate-900 border border-slate-800">
                <button onclick="switchGradingSystem('5.0')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${system === '5.0' ? 'btn-accent' : 'text-slate-400 hover:text-white'}">5.0 Scale (NUC)</button>
                <button onclick="switchGradingSystem('4.0')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${system === '4.0' ? 'btn-accent' : 'text-slate-400 hover:text-white'}">4.0 Scale</button>
              </div>
              <button onclick="openScaleConfigModal()" class="px-3.5 py-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-xs font-medium text-slate-200 border border-slate-700 transition">Configure Scale</button>
              <button onclick="openAddSemesterModal()" class="btn-accent px-3.5 py-2 rounded-xl text-xs font-semibold">+ New Semester</button>

          </div>

              <span class="text-xs text-slate-400">Cumulative CGPA</span>
              <div class="flex items-baseline justify-between mt-1.5">
                <span class="text-2xl font-extrabold font-mono text-white">${cgpaStats.cgpa.toFixed(2)} <span class="text-xs font-normal text-slate-400">/ ${scaleMax.toFixed(1)}</span></span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold border ${cgpaStats.standing.color}">${cgpaStats.standing.label.split(' ')[0]} ${cgpaStats.standing.label.split(' ')[1] || ''}</span>
              </div>
            </div>
            <div class="glass-card rounded-2xl p-4">
              <span class="text-xs text-slate-400">Selected Semester GPA</span>
              <div class="flex items-baseline justify-between mt-1.5">
                <span class="text-2xl font-extrabold font-mono text-accent">${activeSemStats.gpa.toFixed(2)}</span>
                <span class="text-xs text-slate-400 font-mono">${activeSemStats.totalPoints} / ${activeSemStats.gradedUnits * scaleMax} pts</span>
              </div>
            </div>
            <div class="glass-card rounded-2xl p-4">
              <span class="text-xs text-slate-400">Cumulative Credit Units</span>
              <div class="flex items-baseline justify-between mt-1.5">
                <span class="text-2xl font-extrabold font-mono text-emerald-400">${cgpaStats.cumUnits} <span class="text-xs font-normal text-slate-400">Graded</span></span>
                <span class="text-xs text-slate-400">${cgpaStats.totalRegisteredUnits} Total CU</span>

            <div class="glass-card rounded-2xl p-4">
              <span class="text-xs text-slate-400">Class Standing</span>
              <p class="text-sm font-bold text-white mt-2 truncate">${cgpaStats.standing.label}</p>
              <p class="text-[11px] text-slate-400 mt-0.5">${semesters.length} Recorded Semesters</p>
            </div>
          </div>

          <!-- Semester Selector Pills -->
          <div class="flex items-center gap-2 overflow-x-auto pb-1">
            ${semesters.map(sem => {
              const isSel = sem.id === activeSem?.id;
              const sGpa = AcademicEngine.calculateSemesterGPA(sem).gpa;
              return `
                <button onclick="selectGpaSemester('${sem.id}')"
                  class="px-3.5 py-2 rounded-xl text-xs font-medium whitespace-nowrap border transition flex items-center gap-2 ${isSel ? 'bg-accent/20 border-accent text-white font-semibold' : 'bg-slate-900/70 border-slate-800 text-slate-400 hover:text-white'}">

          <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">

            <div class="xl:col-span-8 glass-card rounded-2xl p-5">
              ${activeSem ? `
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                  <div>
                    <div class="flex items-center gap-2">
                      <h3 class="text-base font-bold text-white">${escapeHtml(activeSem.name)}</h3>
                      ${activeSem.id === appState.profile.currentSemesterId ? `<span class="px-2 py-0.5 rounded-full text-[10px] bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">Active Semester</span>` : `<button onclick="setAsCurrentSemester('${activeSem.id}')" class="text-[11px] text-accent hover:underline">Set as Active</button>`}

                  <div class="flex items-center gap-2">
                    <button onclick="openCourseModal('${activeSem.id}')" class="btn-accent px-3.5 py-2 rounded-xl text-xs font-semibold">+ Register Course</button>

                  </div>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse">
                    <thead>
                      <tr class="border-b border-slate-800 text-[11px] uppercase tracking-wider text-slate-400">

                    <tbody class="divide-y divide-slate-800/60 text-xs">

                          <tr class="hover:bg-slate-800/30 transition">
                            <td class="py-3 px-3 font-mono font-bold text-accent whitespace-nowrap">${escapeHtml(course.code)}</td>
                            <td class="py-3 px-3 font-medium text-slate-200">${escapeHtml(course.title)}</td>
                            <td class="py-3 px-3 text-center font-mono text-slate-300">${course.units}</td>
                            <td class="py-3 px-3 text-center">
                              <select onchange="updateCourseGrade('${activeSem.id}', '${course.id}', this.value)"
                                class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 font-mono text-xs text-white focus:border-accent focus:outline-none">
                                <option value="IP" ${course.grade === 'IP' ? 'selected' : ''}>IP (In Progress)</option>
                                ${scaleRows.map(r => `<option value="${r.grade}" ${course.grade === r.grade ? 'selected' : ''}>${r.grade} (${r.points})</option>`).join('')}
                              </select>
                            </td>
                            <td class="py-3 px-3 text-center font-mono font-semibold ${pts === 0 ? 'text-rose-400' : 'text-slate-200'}">${weighted}</td>
                            <td class="py-3 px-3 text-right whitespace-nowrap">
                              <button onclick="openCourseModal('${activeSem.id}', '${course.id}')" class="px-2 py-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">Edit</button>
                              <button onclick="deleteCourse('${activeSem.id}', '${course.id}')" class="px-2 py-1 rounded-lg text-rose-400 hover:bg-rose-500/15">Delete</button>

                          </tr>
                        `;
                      }).join('') || `<tr><td colspan="6" class="py-8 text-center text-slate-400">No courses registered in this semester yet.</td></tr>`}
                    </tbody>
                  </table>
                </div>
              ` : ''}
            </div>

            <!-- Target CGPA & Grade Projector (4 cols) -->

              <div class="glass-card rounded-2xl p-5">
                <h3 class="text-sm font-bold text-white mb-1">Target CGPA & Grade Projector</h3>
                <p class="text-xs text-slate-400 mb-4">Calculate the exact semester GPA required to reach your target CGPA.</p>

                <div class="space-y-3">
                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Desired Target CGPA (Max ${scaleMax.toFixed(1)})</label>
                    <input id="projTargetCgpa" type="number" step="0.01" min="0" max="${scaleMax}" value="${Math.min(scaleMax, appState.goals.targetCgpa || 4.50)}"
                      oninput="updateGradeProjection()" class="input-field font-mono" />
                  </div>
                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Upcoming / Remaining Credit Units</label>

                      oninput="updateGradeProjection()" class="input-field font-mono" />

    function updateGradeProjection() {
      const box = document.getElementById('projectionResultBox');
      if (!box) return;
      const target = parseFloat(document.getElementById('projTargetCgpa')?.value) || 0;
      const nextUnits = parseInt(document.getElementById('projNextUnits')?.value, 10) || 0;
      const cgpaStats = AcademicEngine.calculateCGPA();
      const system = appState.gradingConfig.system;
      const res = AcademicEngine.projectRequiredGPA(cgpaStats.cumPoints, cgpaStats.cumUnits, nextUnits, target, system);

      if (res.alreadyMet) {

    function handleSaveScaleConfig(e) {
      e.preventDefault();
      const sys = appState.gradingConfig.system;
      const fd = new FormData(e.target);
      const proposed = appState.gradingConfig.scales[sys].map((r, i) => ({
        ...r, minScore: Number(fd.get(`min_${i}`)), maxScore: Number(fd.get(`max_${i}`)), points: Number(fd.get(`pts_${i}`))
      }));
      if (proposed.some(r => !Number.isFinite(r.minScore) || !Number.isFinite(r.maxScore) || !Number.isFinite(r.points) ||
          r.minScore < 0 || r.maxScore > 100 || r.minScore > r.maxScore || r.points < 0 || r.points > Number(sys))) {
        showToast('Invalid grading boundaries or points for the selected scale.', 'error'); return;
      }
      const sorted = proposed.slice().sort((a,b) => a.minScore-b.minScore);
      if (!sorted.length || sorted[0].minScore !== 0 || sorted[sorted.length - 1].maxScore !== 100) {
        showToast('Grade ranges must cover the complete 0–100 score scale.', 'error'); return;
      }
      for (let i=1;i<sorted.length;i++) {
        if (sorted[i].minScore <= sorted[i-1].maxScore) {
          showToast('Grade score ranges overlap. Adjust the boundaries.', 'error'); return;
        }
        if (sorted[i].minScore !== sorted[i-1].maxScore + 1) {
          showToast(`There is a score-range gap between ${sorted[i-1].maxScore} and ${sorted[i].minScore}. Every score from 0 to 100 must belong to a grade.`, 'error'); return;
        }
      }
      appState.gradingConfig.scales[sys] = proposed;
      const currentClasses = appState.gradingConfig.classifications?.[sys] || [];
      const classes = currentClasses.map((r,i)=>({ label: String(fd.get(`class_label_${i}`) || '').trim(), min: Number(fd.get(`class_min_${i}`)) }));
      if (classes.some(r => !r.label || !Number.isFinite(r.min) || r.min < 0 || r.min > Number(sys))) {
        showToast('Enter valid degree classification labels and thresholds.', 'error'); return;
      }
      const classSorted = classes.slice().sort((a,b)=>b.min-a.min);
      if (classSorted.some((r,i)=>i>0 && r.min >= classSorted[i-1].min)) { showToast('Degree classification thresholds must be distinct.', 'error'); return; }
      if (classSorted.length && classSorted[classSorted.length-1].min !== 0) { showToast('The lowest classification threshold must be 0.', 'error'); return; }
      appState.gradingConfig.classifications = appState.gradingConfig.classifications || {};
      appState.gradingConfig.classifications[sys] = classes;
      saveState();
      closeModal();
      renderCurrentModule();
      showToast('Grading scale updated!');
    }

    /* ============================================================================
       8. MODULE 3: TIMETABLE (WEEKLY & DAILY + CLASH DETECTION)
    ============================================================================ */
    const WEEK_DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    function detectTimetableClashes(entries = appState.timetable) {
      const clashes = [];
      for (let i = 0; i < entries.length; i++) {
        for (let j = i + 1; j < entries.length; j++) {
          const a = entries[i];
          const b = entries[j];
          const sameOccurrence = a.day === b.day &&
            ((a.recurring && b.recurring) ||
             (!a.recurring && !b.recurring && a.date && b.date && a.date === b.date) ||
             (a.recurring && !b.recurring && b.date && new Date(`${b.date}T12:00:00`).toLocaleDateString('en-US', { weekday: 'long' }) === a.day) ||
             (b.recurring && !a.recurring && a.date && new Date(`${a.date}T12:00:00`).toLocaleDateString('en-US', { weekday: 'long' }) === b.day));
          if (sameOccurrence && a.startTime < b.endTime && b.startTime < a.endTime) clashes.push({ a, b });
        }
      }
      return clashes;
    }

    function renderTimetable() {
      const clashes = detectTimetableClashes();
      const clashIds = new Set();
      clashes.forEach(c => { clashIds.add(c.a.id); clashIds.add(c.b.id); });

      return `
        <div class="module-enter space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

            </div>

                <button onclick="setTimetableView('weekly')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${timetableView === 'weekly' ? 'btn-accent' : 'text-slate-400 hover:text-white'}">Weekly Grid</button>
                <button onclick="setTimetableView('daily')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${timetableView === 'daily' ? 'btn-accent' : 'text-slate-400 hover:text-white'}">Daily Focus</button>
              </div>
              <button onclick="openTimetableModal()" class="btn-accent px-3.5 py-2 rounded-xl text-xs font-semibold">+ Add Class</button>
            </div>
          </div>

          ${clashes.length ? `
            <div class="p-4 rounded-2xl bg-rose-500/15 border border-rose-500/40 flex items-start gap-3">
              <span class="text-rose-400 text-lg">⚠️</span>
              <div class="text-xs">
                <p class="font-bold text-rose-300">Timetable Clash Detected (${clashes.length})</p>
                <ul class="mt-1 space-y-1 text-rose-200/90">
                  ${clashes.map(c => `<li>• <strong>${escapeHtml(c.a.courseCode)}</strong> (${c.a.startTime}-${c.a.endTime}) overlaps with <strong>${escapeHtml(c.b.courseCode)}</strong> (${c.b.startTime}-${c.b.endTime}) on <strong>${c.a.day}</strong></li>`).join('')}
                </ul>
              </div>
            </div>
          ` : ''}

          ${timetableView === 'weekly' ? `
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
              ${WEEK_DAYS.map(day => {
                const dayItems = appState.timetable.filter(t => t.day === day).sort((a, b) => a.startTime.localeCompare(b.startTime));
                return `
                  <div class="glass-card rounded-2xl p-4 flex flex-col">
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800/80">
                      <span class="text-sm font-bold text-white">${day}</span>
                      <span class="text-[11px] font-mono text-slate-400">${dayItems.length} ${dayItems.length === 1 ? 'Class' : 'Classes'}</span>
                    </div>
                    <div class="space-y-2.5 flex-1">
                      ${dayItems.length ? dayItems.map(item => {
                        const isClash = clashIds.has(item.id);
                        return `
                          <div class="p-3 rounded-xl bg-slate-900/85 border ${isClash ? 'border-rose-500/60 bg-rose-950/20' : 'border-slate-800 hover:border-accent/40'} transition group">
                            <div class="flex items-center justify-between gap-2">
                              <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold ${isClash ? 'bg-rose-500/20 text-rose-300' : 'bg-accent/20 text-accent'}">${escapeHtml(item.courseCode)}</span>
                              <span class="text-[11px] font-mono text-slate-300">${item.startTime} - ${item.endTime}</span>
                            </div>
                            <p class="text-xs font-semibold text-white mt-1.5">${escapeHtml(item.courseTitle)}</p>
                            <p class="text-[11px] text-slate-400 mt-1">📍 ${escapeHtml(item.location)}</p>
                            <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-800/60 text-[10px] text-slate-500">
                              <span>${escapeHtml(item.lecturer || 'Staff')} ${item.recurring ? '• Weekly' : '• One-off'}</span>
                              <div class="flex gap-2">
                                <button onclick="openTimetableModal('${item.id}')" class="text-slate-300 hover:text-accent">Edit</button>
                                <button onclick="deleteTimetableEntry('${item.id}')" class="text-rose-400 hover:underline">Delete</button>
                              </div>
                            </div>
                          </div>
                        `;
                      }).join('') : `<div class="py-8 text-center text-xs text-slate-500">Free day — no lectures scheduled</div>`}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `
            <!-- Daily Focus View -->
            <div class="glass-card rounded-2xl p-5">
              <div class="flex flex-wrap items-center gap-2 mb-5">
                ${WEEK_DAYS.map(d => `

                  if (!list.length) return `<p class="text-xs text-slate-400 py-10 text-center">No lectures scheduled for ${timetableSelectedDay}.</p>`;
                  return list.map(item => `
                    <div class="p-4 rounded-xl bg-slate-900/90 border ${clashIds.has(item.id) ? 'border-rose-500/60' : 'border-slate-800'} flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                      <div class="flex items-start gap-4">
                        <div class="px-3 py-2 rounded-xl bg-accent/15 border border-accent/30 text-center shrink-0">
                          <div class="text-xs font-mono font-bold text-accent">${item.startTime}</div>

                        <div>

                      </div>
                    </div>
                  `).join('');
                })()}
              </div>
            </div>
          `}

    function handleSaveTimetable(e, entryId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const startTime = fd.get('startTime');
      const endTime = fd.get('endTime');
      if (startTime >= endTime) {
        showToast('End time must be after start time.', 'error');
        return;
      }

      const payload = {
        id: entryId || uid('tt'),
        courseCode: fd.get('courseCode').trim().toUpperCase(),
        courseTitle: fd.get('courseTitle').trim(),
        day: fd.get('day'),
        startTime,
        endTime,
        location: fd.get('location').trim(),
        lecturer: fd.get('lecturer').trim(),
        recurring: fd.get('recurring') === 'on',
        date: fd.get('date') || ''
      };
      if (!payload.recurring && !payload.date) { showToast('Choose a date for a one-off class.', 'error'); return; }
      if (!payload.recurring && new Date(`${payload.date}T12:00:00`).toLocaleDateString('en-US', { weekday: 'long' }) !== payload.day) { showToast('The selected day does not match the one-off date.', 'error'); return; }

      const tempList = entryId
        ? appState.timetable.map(t => t.id === entryId ? payload : t)
        : [...appState.timetable, payload];

      const clashes = detectTimetableClashes(tempList);
      appState.timetable = tempList;
      logActivity(`Scheduled ${payload.courseCode} on ${payload.day} (${startTime}-${endTime})`, 'timetable');
      closeModal();
      renderCurrentModule();

      if (clashes.length) {
        showToast('Saved, but a timetable clash was detected! Check banner.', 'error');
      } else {
        showToast('Lecture schedule saved!');
      }
    }

    async function enableDeadlineNotifications() {
      if (!('Notification' in window)) {
        appState.preferences.remindersEnabled = true; saveState();
        showToast('Browser notifications are unsupported. In-app deadline reminders will run while UniPilot is open.', 'info');
        checkDeadlineNotifications();
        return;
      }
      try {
        const permission = Notification.permission === 'default' ? await Notification.requestPermission() : Notification.permission;
        if (permission !== 'granted') {
          appState.preferences.remindersEnabled = true; saveState();
          showToast('Notification permission was not granted. In-app deadline reminders will run while UniPilot is open.', 'info');
          checkDeadlineNotifications(); return;
        }
        appState.preferences.remindersEnabled = true; saveState();
        checkDeadlineNotifications();
        showToast('Deadline notifications enabled. Keep this page open; browser-only reminders cannot run after UniPilot is closed.');
      } catch (err) { showToast('Could not request notification permission. Check browser/site settings.', 'error'); }
    }

    function checkDeadlineNotifications() {
      if (!appState?.preferences?.remindersEnabled) return;
      // In-app check is also run when notifications are unavailable/denied.
      const now = Date.now();
      const leadHours = Number(appState.preferences.reminderLeadHours);
      const lead = (Number.isFinite(leadHours) && leadHours >= 0 ? leadHours : 24) * 3600000;
      const eligible = appState.tasks.filter(t => !t.completed && t.dueDate).map(t => {
        const due = localDateTimeFromParts(t.dueDate, t.dueTime || '23:59');
        return { task: t, due, key: `${t.id}:${t.dueDate}:${t.dueTime || '23:59'}` };
      }).filter(x => Number.isFinite(x.due) && x.due >= now && x.due - now <= lead);
      if (!eligible.length) return;
      let sent = [];
      try { sent = JSON.parse(localStorage.getItem('unipilot_notified_deadlines') || '[]'); } catch (_) {}
      const sentSet = new Set(Array.isArray(sent) ? sent : []);
      let changed = false;
      const canNotify = 'Notification' in window && Notification.permission === 'granted';
      eligible.forEach(({task, due, key}) => {
        if (sentSet.has(key)) return;
        const title = task.title || 'Task';
        const body = `${task.courseCode || 'Course'} is due ${task.dueDate} at ${task.dueTime || '23:59'}.`;
        if (canNotify) {
          try {
            const notification = new Notification(`UniPilot deadline: ${title}`, {
              body, tag: `unipilot-${String(task.id || key).replace(/[^a-zA-Z0-9_-]/g, '')}`, timestamp: due, renotify: false
            });
            notification.onclick = () => { try { window.focus(); } catch (_) {} notification.close(); };
            sentSet.add(key); changed = true;
            return;
          } catch (err) { console.warn('Browser notification failed; showing an in-app reminder instead.', err); }
        }
        showToast(`Deadline approaching: ${title} — ${body}`, 'info');
        sentSet.add(key); changed = true;
      });
      if (changed) {
        try { localStorage.setItem('unipilot_notified_deadlines', JSON.stringify([...sentSet].slice(-500))); }
        catch (err) { console.warn('Could not persist notification history; duplicate reminders may occur.', err); }
      }
    }

        notes: fd.get('notes').trim(),
        completed: taskId ? (appState.tasks.find(t => t.id === taskId)?.completed || false) : false

    function createNewNote() {
      const id = uid('note');
      appState.notes.unshift({
        id,
        title: 'Untitled Lecture Note',
        courseCode: 'CSC 311',
        folder: noteFolderFilter !== 'All' && noteFolderFilter !== 'Trash' ? noteFolderFilter : 'Lecture Notes',
        content: '',
        updatedAt: new Date().toISOString(),
        deleted: false
      });
      noteFolderFilter = 'All';
      activePdfViewerDoc = null;
      activeNoteId = id;
      logActivity('Created a new lecture note', 'note');
      renderCurrentModule();
    }

    function updateCurrentNoteField(field, value) {
      const note = appState.notes.find(n => n.id === activeNoteId);
      if (!note) return;
      note[field] = value;
      note.updatedAt = new Date().toISOString();
      saveState();
    }

    function toggleTrashNote(id, toTrash) {
      const note = appState.notes.find(n => n.id === id);
      if (!note) return;
      note.deleted = toTrash;
      if (toTrash && activeNoteId === id) activeNoteId = null;
      saveState();
      renderCurrentModule();
      showToast(toTrash ? 'Note moved to Trash' : 'Note restored!');
    }

    function permanentlyDeleteNote(id) {
      appState.notes = appState.notes.filter(n => n.id !== id);
      if (activeNoteId === id) activeNoteId = null;
      saveState();
      renderCurrentModule();
      showToast('Note permanently deleted', 'info');
    }

    async function handlePdfUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      if (file.type !== 'application/pdf') {
        showToast('Please select a valid PDF file.', 'error');
        return;
      }
      try {
        const buffer = await file.arrayBuffer();
        const docId = uid('pdf');
        await savePdfBlob(docId, buffer, file.type);
        const sizeKb = Math.round(file.size / 1024);
        const sizeLabel = sizeKb > 1024 ? `${(sizeKb / 1024).toFixed(1)} MB` : `${sizeKb} KB`;

        appState.documents.unshift({
          id: docId,
          name: file.name,
          courseCode: 'CSC 311',
          folder: noteFolderFilter !== 'All' && noteFolderFilter !== 'Trash' ? noteFolderFilter : 'Lecture Notes',
          sizeLabel,
          uploadedAt: new Date().toISOString(),
          isBuiltIn: false,
          deleted: false
        });
        logActivity(`Imported PDF: ${file.name}`, 'note');
        await openPdfDocument(docId);
        showToast('PDF imported & stored offline!');
      } catch (err) {
        console.error(err);
        showToast('Failed to store PDF file.', 'error');
      }
    }

    async function openPdfDocument(docId) {
      const doc = appState.documents.find(d => d.id === docId);
      if (!doc) return;
      if (doc.isBuiltIn) {
        activePdfViewerDoc = { ...doc, blobUrl: null };
        renderCurrentModule();
        return;
      }
      await window.launchPdfFullscreen(docId);
    }

    function toggleTrashDoc(id, toTrash) {
      const doc = appState.documents.find(d => d.id === id);
      if (!doc) return;
      doc.deleted = toTrash;
      if (toTrash && activePdfViewerDoc?.id === id) activePdfViewerDoc = null;
      saveState();
      renderCurrentModule();
      showToast(toTrash ? 'PDF moved to Trash' : 'PDF restored!');
    }

    async function permanentlyDeleteDoc(id) {
      await deletePdfBlob(id);
      appState.documents = appState.documents.filter(d => d.id !== id);
      if (activePdfViewerDoc?.id === id) activePdfViewerDoc = null;
      saveState();
      renderCurrentModule();
      showToast('PDF deleted permanently', 'info');
    }

    /* ============================================================================
       11. MODULE 6: STUDY PLANNER (TIMER, TARGETS, ALLOCATIONS & LOGS)
    ============================================================================ */
    function renderStudyPlanner() {

                <button onclick="setTimerMode('focus', 25)" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${timerState.mode === 'focus' ? 'btn-accent' : 'text-slate-400'}">Focus (25m)</button>
                <button onclick="setTimerMode('short', 5)" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${timerState.mode === 'short' ? 'btn-accent' : 'text-slate-400'}">Short Break (5m)</button>
                <button onclick="setTimerMode('long', 15)" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${timerState.mode === 'long' ? 'btn-accent' : 'text-slate-400'}">Long Break (15m)</button>
              </div>

              <div class="w-48 h-48 rounded-full border-4 border-accent/30 bg-slate-950/80 flex flex-col items-center justify-center accent-glow mb-5">
                <span id="studyTimerClock" class="text-4xl font-extrabold font-mono text-white tracking-wider">${mins}:${secs}</span>
                <span class="text-[11px] uppercase tracking-widest text-accent mt-1">${timerState.running ? 'Session Active' : 'Ready'}</span>
              </div>

              <div class="w-full grid grid-cols-2 gap-2.5 mb-4 text-left">
                <div>
                  <label class="block text-[10px] text-slate-400 mb-1">Course</label>
                  <input value="${escapeHtml(timerState.courseCode)}" onchange="timerState.courseCode=this.value.toUpperCase()" class="input-field py-1.5 text-xs font-mono uppercase" />
                </div>
                <div>
                  <label class="block text-[10px] text-slate-400 mb-1">Focus Topic</label>
                  <input value="${escapeHtml(timerState.topic)}" onchange="timerState.topic=this.value" class="input-field py-1.5 text-xs" />
                </div>
              </div>

              <div class="flex items-center gap-3 w-full">
                <button onclick="toggleStudyTimer()" class="flex-1 btn-accent py-2.5 rounded-xl text-xs font-bold">
                  ${timerState.running ? '⏸ Pause Timer' : '▶ Start Session'}
                </button>
                <button onclick="resetStudyTimer()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200">Reset</button>
                <button onclick="completeStudySessionNow()" class="px-3.5 py-2.5 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/30 text-xs font-semibold text-emerald-300" title="Log Completed Session">✓ Log</button>
              </div>
            </div>

            <!-- Targets & Subject Allocation (7 cols) -->
            <div class="lg:col-span-7 space-y-6">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="glass-card rounded-2xl p-4">
                  <div class="flex items-center justify-between text-xs mb-2">

                    <span class="font-mono font-bold text-white">${todayHours}h / ${study.dailyTargetHours}h</span>
                  </div>
                  <div class="w-full h-2.5 rounded-full bg-slate-800 overflow-hidden">
                    <div class="h-full btn-accent rounded-full" style="width: ${Math.min(100, (todayHours / study.dailyTargetHours) * 100)}%"></div>

                  ${study.allocations.map(al => {

                        <div class="flex items-center justify-between text-xs mb-1">

                        </div>

              <!-- Weekly Study Timetable Blocks -->
              <div class="glass-card rounded-2xl p-5">
                <h3 class="text-sm font-bold text-white mb-3">Planned Study Timetable</h3>

          <!-- Completed Study Sessions Log -->

              ${study.sessions.slice(0, 6).map(s => `
                <div class="p-3.5 rounded-xl bg-slate-900/80 border border-slate-800 flex items-center justify-between">

                    <span class="font-mono text-xs font-bold text-accent">${escapeHtml(s.courseCode)}</span>

                    <span class="text-[10px] text-slate-500">${escapeHtml(s.date)}</span>
                  </div>
                  <span class="px-2.5 py-1 rounded-lg bg-emerald-500/15 text-emerald-300 font-mono text-xs font-bold shrink-0">${s.durationMinutes}m</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function setTimerMode(mode, mins) {
      if (timerState.intervalId) clearInterval(timerState.intervalId);
      timerState.running = false;
      timerState.mode = mode;
      timerState.totalSeconds = mins * 60;
      timerState.secondsLeft = mins * 60;
      timerState.startedAt = null;
      timerState.elapsedSeconds = 0;
      renderCurrentModule();
    }

    function toggleStudyTimer() {
      if (timerState.running) {
        clearInterval(timerState.intervalId);
        timerState.running = false;
        timerState.elapsedSeconds = Math.min(timerState.totalSeconds, timerState.totalSeconds - timerState.secondsLeft);
        renderCurrentModule();
        return;
      }
      if (timerState.secondsLeft <= 0) timerState.secondsLeft = timerState.totalSeconds;
      timerState.running = true;
      timerState.startedAt = Date.now();
      timerState.intervalId = setInterval(() => {
        timerState.secondsLeft = Math.max(0, timerState.secondsLeft - 1);
        const clockEl = document.getElementById('studyTimerClock');
        if (clockEl) clockEl.textContent = `${String(Math.floor(timerState.secondsLeft / 60)).padStart(2,'0')}:${String(timerState.secondsLeft % 60).padStart(2,'0')}`;
        if (timerState.secondsLeft <= 0) {
          clearInterval(timerState.intervalId);
          timerState.running = false;
          if (timerState.mode === 'focus') completeStudySessionNow(true);
          else { playChime(); showToast('Break completed. Ready for another focus session!'); renderCurrentModule(); }
        }
      }, 1000);
      renderCurrentModule();
    }

    function resetStudyTimer() {
      if (timerState.intervalId) clearInterval(timerState.intervalId);
      timerState.running = false;
      timerState.secondsLeft = timerState.totalSeconds;
      timerState.startedAt = null;
      timerState.elapsedSeconds = 0;
      renderCurrentModule();
    }

    function completeStudySessionNow(completed = false) {
      if (timerState.intervalId) clearInterval(timerState.intervalId);
      timerState.running = false;
      if (timerState.mode !== 'focus') {
        showToast('Break sessions are not recorded as study time.', 'info');
        resetStudyTimer();
        return;
      }
      const elapsedSeconds = completed ? timerState.totalSeconds :
        Math.max(0, timerState.totalSeconds - timerState.secondsLeft);
      const elapsedMins = Math.floor(elapsedSeconds / 60);
      if (elapsedSeconds <= 0) { showToast('No focus time to record yet.', 'info'); resetStudyTimer(); return; }
      appState.study.sessions.unshift({
        id: uid('ss'), courseCode: timerState.courseCode || 'CSC 311',
        durationMinutes: Math.max(1, Math.round(elapsedSeconds / 60)),
        date: new Date().toLocaleDateString('en-CA'), topic: timerState.topic || 'Focused Study',
        mode: 'focus', durationSeconds: elapsedSeconds
      });
      logActivity(`Logged ${elapsedMins > 0 ? elapsedMins : '<1'}m study session for ${timerState.courseCode}`, 'study');
      timerState.secondsLeft = timerState.totalSeconds;
      timerState.elapsedSeconds = 0;
      timerState.startedAt = null;
      playChime();
      renderCurrentModule();
      showToast(`Logged ${Math.round(elapsedSeconds / 60)} minutes of focus time!`);
    }

    function openStudyAllocationModal(id = '') {
      const existing = appState.study.allocations.find(a => a.id === id);
      openModal(`<h3 class="text-base font-bold text-white mb-4">${existing ? 'Edit' : 'Add'} Course Study Target</h3>
        <form onsubmit="handleSaveStudyAllocation(event, '${id}')" class="space-y-3">
          <label class="block text-xs text-slate-400">Course code<input name="courseCode" required value="${escapeHtml(existing?.courseCode || '')}" class="input-field mt-1" placeholder="CSC 311"></label>
          <label class="block text-xs text-slate-400">Weekly target hours<input name="targetHours" type="number" min="0.5" step="0.5" required value="${existing?.targetHours ?? 4}" class="input-field mt-1"></label>
          <div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs">Cancel</button><button class="btn-accent px-4 py-2 rounded-xl text-xs">Save target</button></div>
        </form>`);
    }
    function handleSaveStudyAllocation(e, id) {
      e.preventDefault(); const fd = new FormData(e.target);
      const item = { id: id || uid('alloc'), courseCode: fd.get('courseCode').trim().toUpperCase(), targetHours: Number(fd.get('targetHours')) };
      if (!item.courseCode || !Number.isFinite(item.targetHours) || item.targetHours <= 0) return showToast('Enter a valid course and target.', 'error');
      const idx = appState.study.allocations.findIndex(a => a.id === id || a.courseCode === item.courseCode);
      if (idx >= 0) appState.study.allocations[idx] = item; else appState.study.allocations.push(item);
      saveState(); closeModal(); renderCurrentModule(); showToast('Study allocation saved.');
    }
    function deleteStudyAllocation(id) {
      appState.study.allocations = appState.study.allocations.filter(a => a.id !== id);
      saveState(); renderCurrentModule(); showToast('Study allocation deleted.', 'info');
    }

    function openAddStudySlotModal() {
      openModal(`

          <h3 class="text-base font-bold text-white">Add Planned Study Block</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white">✕</button>
        </div>
        <form onsubmit="handleSaveStudySlot(event)" class="space-y-4 mt-4">

    function handleSaveStudySlot(e) {

    /* ============================================================================
       12. MODULE 7: EXAMINATION CENTRE (CUSTOM CBT QUIZZES, TIMER & REVIEW)

    function renderExaminationCentre() {

        return `
          <div class="module-enter max-w-4xl mx-auto space-y-6">
            <div class="glass-card rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4 border-accent/40">

                <span class="px-2.5 py-0.5 rounded text-xs font-mono font-bold bg-accent/20 text-accent">${escapeHtml(quiz.courseCode)}</span>
                <h2 class="text-base sm:text-lg font-bold text-white mt-1">${escapeHtml(quiz.title)}</h2>
              </div>
              <div class="flex items-center gap-3">
                <div class="px-4 py-2 rounded-xl bg-slate-950 border border-amber-500/40 text-center">
                  <span class="block text-[10px] uppercase text-slate-400">Time Remaining</span>
                  <span id="cbtTimerDisplay" class="text-lg font-mono font-extrabold text-amber-400">${mins}:${secs}</span>

    function startCbtExam(quizId) {
      const quiz = appState.quizzes.find(q => q.id === quizId);
      if (!quiz || !quiz.questions.length) {
        showToast('Add at least one question before starting.', 'error');
        return;
      }
      activeExamSession = {
        quizId,
        currentIndex: 0,
        answers: new Array(quiz.questions.length).fill(null),
        secondsLeft: quiz.durationMinutes * 60,
        totalSeconds: quiz.durationMinutes * 60,
        intervalId: setInterval(() => {
          if (!activeExamSession) return;
          activeExamSession.secondsLeft--;
          const el = document.getElementById('cbtTimerDisplay');
          if (el) {
            const m = String(Math.floor(activeExamSession.secondsLeft / 60)).padStart(2, '0');
            const s = String(activeExamSession.secondsLeft % 60).padStart(2, '0');
            el.textContent = `${m}:${s}`;
          }
          if (activeExamSession.secondsLeft <= 0) {
            submitActiveExam();
          }
        }, 1000)
      };
      renderCurrentModule();
    }

    function selectExamOption(qIdx, optIdx) {
      if (!activeExamSession) return;
      activeExamSession.answers[qIdx] = optIdx;
      renderCurrentModule();
    }

    function submitActiveExam() {
      if (!activeExamSession) return;
      clearInterval(activeExamSession.intervalId);
      const quiz = appState.quizzes.find(q => q.id === activeExamSession.quizId);
      let score = 0;
      quiz.questions.forEach((q, idx) => {
        if (activeExamSession.answers[idx] === q.correctIndex) score++;
      });
      const total = quiz.questions.length;
      const percentage = Math.round((score / total) * 100);
      const timeTakenSeconds = Math.max(5, activeExamSession.totalSeconds - activeExamSession.secondsLeft);
      const attemptId = uid('att');

      appState.quizAttempts.unshift({
        id: attemptId,
        quizId: quiz.id,
        quizTitle: quiz.title,
        courseCode: quiz.courseCode,
        score,
        total,
        percentage,
        timeTakenSeconds,
        completedAt: new Date().toISOString(),
        answers: [...activeExamSession.answers]
      });

      activeExamSession = null;
      reviewingAttemptId = attemptId;
      playChime();
      logActivity(`Scored ${score}/${total} (${percentage}%) on ${quiz.courseCode} CBT`, 'exam');
      renderCurrentModule();
      showToast(`CBT Submitted! Score: ${score}/${total} (${percentage}%)`);
    }

    function renderAcademicAnalytics() {

      // Grade Distribution across all graded courses
      const gradeCounts = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 };
      let totalGraded = 0;
      semesters.forEach(s => s.courses.forEach(c => {
        if (gradeCounts.hasOwnProperty(c.grade)) {
          gradeCounts[c.grade]++;

      // Study hours by course
      const courseStudyMap = {};
      study.sessions.forEach(s => {
        courseStudyMap[s.courseCode] = (courseStudyMap[s.courseCode] || 0) + s.durationMinutes;

      const studyEntries = Object.entries(courseStudyMap).sort((a, b) => b[1] - a[1]);
      const maxStudyMins = Math.max(60, ...studyEntries.map(e => e[1]));

      const completedTasks = tasks.filter(t => t.completed).length;
      const completionRate = tasks.length ? Math.round((completedTasks / tasks.length) * 100) : 100;
      const totalStudyHours = Number((study.sessions.reduce((a, b) => a + b.durationMinutes, 0) / 60).toFixed(1));

      return `

    async function downloadJsonBackup() {
      try {
        const pdfRecords = await listPdfRecords();
        const pdfFiles = pdfRecords.map(r => ({ id: r.id, mimeType: r.mimeType || 'application/pdf', base64: bytesToBase64(r.buffer) }));
        const payload = { format: 'unipilot-backup', version: 3, exportedAt: new Date().toISOString(), state: appState, pdfFiles };
        const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = `UniPilot_Backup_${appState.profile.matricNo || 'Student'}_${new Date().toISOString().slice(0,10)}.json`;
        a.click(); setTimeout(() => URL.revokeObjectURL(url), 30000);
        showToast(`Complete backup downloaded (${pdfFiles.length} PDF file(s)).`);
      } catch (err) { console.error(err); showToast('Backup failed: ' + err.message, 'error'); }
    }

    async function handleRestoreJsonBackup(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        if (file.size > 750 * 1024 * 1024) throw new Error('Backup exceeds the 750 MB safety limit. Split large PDF collections into smaller backups.');
        const parsed = JSON.parse(await file.text());
        const wrapped = parsed.format === 'unipilot-backup' && parsed.state;
        const state = wrapped ? parsed.state : parsed;
        if (!state || typeof state !== 'object' || !state.profile || !Array.isArray(state.semesters) ||
            (state.timetable !== undefined && !Array.isArray(state.timetable)) ||
            (state.tasks !== undefined && !Array.isArray(state.tasks)) ||
            (state.documents !== undefined && !Array.isArray(state.documents))) {
          throw new Error('Invalid UniPilot backup structure.');
        }
        const defaults = getDefaultState();
        const restored = {
          ...defaults, ...state,
          profile: { ...defaults.profile, ...(state.profile || {}) },
          preferences: { ...defaults.preferences, ...(state.preferences || {}) },
          gradingConfig: { ...defaults.gradingConfig, ...(state.gradingConfig || {}), scales: { ...defaults.gradingConfig.scales, ...(state.gradingConfig?.scales || {}) }, classifications: { ...defaults.gradingConfig.classifications, ...(state.gradingConfig?.classifications || {}) } },
          semesters: state.semesters.map(sem => ({ ...sem, courses: Array.isArray(sem.courses) ? sem.courses : [] })),
          study: { ...defaults.study, ...(state.study || {}), allocations: Array.isArray(state.study?.allocations) ? state.study.allocations : [], weeklySchedule: Array.isArray(state.study?.weeklySchedule) ? state.study.weeklySchedule : [], sessions: Array.isArray(state.study?.sessions) ? state.study.sessions : [] },
          timetable: Array.isArray(state.timetable) ? state.timetable : [],
          tasks: Array.isArray(state.tasks) ? state.tasks : [],
          examCountdowns: Array.isArray(state.examCountdowns) ? state.examCountdowns : [],
          notes: Array.isArray(state.notes) ? state.notes : [],
          documents: Array.isArray(state.documents) ? state.documents : [],
          quizzes: Array.isArray(state.quizzes) ? state.quizzes : [],
          quizAttempts: Array.isArray(state.quizAttempts) ? state.quizAttempts : [],
          activities: Array.isArray(state.activities) ? state.activities : []
        };
        const pdfFiles = wrapped ? (Array.isArray(parsed.pdfFiles) ? parsed.pdfFiles : []) : [];
        if (wrapped && !Array.isArray(parsed.pdfFiles)) throw new Error('Backup PDF manifest is malformed.');
        const pdfIds = new Set();
        for (const pdf of pdfFiles) {
          if (!pdf || typeof pdf.id !== 'string' || !pdf.id || typeof pdf.base64 !== 'string') throw new Error('Malformed PDF backup record.');
          if (pdfIds.has(pdf.id)) throw new Error('Duplicate PDF identifier in backup.');
          pdfIds.add(pdf.id);
          const buffer = base64ToBuffer(pdf.base64);
          if (buffer.byteLength < 5 || new TextDecoder().decode(new Uint8Array(buffer.slice(0,5))) !== '%PDF-') throw new Error(`Invalid PDF data for ${pdf.id}.`);
        }
        const pdfRecords = pdfFiles.map(pdf => ({ id: pdf.id, buffer: base64ToBuffer(pdf.base64), mimeType: pdf.mimeType || 'application/pdf' }));
        await replacePdfRecords(pdfRecords);
        appState = restored;
        gpaSelectedSemesterId = appState.profile.currentSemesterId || appState.semesters[0]?.id;
        activePdfViewerDoc = null;
        applyTheme(); saveState(); renderCurrentModule();
        const missingPdfs = appState.documents.filter(d => !d.isBuiltIn && !pdfIds.has(d.id)).length;
        showToast(`Backup restored. ${pdfFiles.length} PDF file(s) restored.${missingPdfs ? ` ${missingPdfs} document record(s) have no embedded PDF data.` : ''}`, missingPdfs ? 'info' : 'success');
      } catch (err) {
        console.error(err);
        showToast('Backup restore failed: ' + err.message, 'error');
      } finally { e.target.value = ''; }
    }

    function exportRecordsCSV() {
      const rows = [['Semester', 'Session', 'Course Code', 'Course Title', 'Credit Units', 'Grade', 'Grade Points']];
      appState.semesters.forEach(sem => {
        sem.courses.forEach(c => {
          const pts = AcademicEngine.getGradePoints(c.grade);
          rows.push([
            `"${sem.name}"`,
            `"${sem.session}"`,
            `"${c.code}"`,
            `"${c.title}"`,
            c.units,
            c.grade,
            pts !== null ? (pts * c.units).toFixed(2) : 'IP'
          ]);
        });
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `UniPilot_Academic_Records_${appState.profile.matricNo}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('CSV academic records exported!');
    }

  function loadPdfJsLibrary() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);

    window.__uniPilotPdfJsPromise = new Promise((resolve, reject) => {
      const bases = ['pdfjs/', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/'];
      const tryBase = index => {
        if (index >= bases.length) {
          window.__uniPilotPdfJsPromise = null;
          reject(new Error('Could not load the PDF engine. Connect to the internet and try again.'));
          return;
        }
        const script = document.createElement('script');
        script.src = bases[index] + 'pdf.min.js';
        script.async = true;
        script.onload = () => {
          if (!window.pdfjsLib) { script.remove(); tryBase(index + 1); return; }
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = bases[index] + 'pdf.worker.min.js';
          resolve(window.pdfjsLib);
        };
        script.onerror = () => { script.remove(); tryBase(index + 1); };
        document.head.appendChild(script);
      };
      tryBase(0);
    });
    return window.__uniPilotPdfJsPromise;
  }

  window.launchPdfFullscreen = async id => {
